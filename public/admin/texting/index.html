<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Text Blast | Ohio Pride PAC Admin</title>
    <meta name="robots" content="noindex,nofollow" />

    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Montserrat:wght@400;600;700;800&family=Roboto+Slab:wght@400;500&display=swap"
      rel="stylesheet"
    />
    <link rel="stylesheet" href="/css/style.css" />
    <link rel="stylesheet" href="/css/site-template.css" />
    <link rel="stylesheet" href="/admin/admin-shared.css" />
    <link rel="stylesheet" href="/admin/admin-shell.css" />
    <link rel="stylesheet" href="/admin/admin-responsive.css" />

    <style>
      /* Text Blast module — layered on admin-shared.css. Brand v2.0.
         Built to be worked one-handed on a phone: big targets, single
         column, sticky progress. The Progress Pride gradient is used for
         the progress meter only, never behind text. */

      .tx-gradient-bar {
        height: 3px; border-radius: 999px; margin: 0 0 20px;
        background: linear-gradient(135deg,#E40303,#FFBC00,#FFED00,#008026,#004DFF,#750787);
      }

      /* ---- Blast list ---- */
      .tx-blast-card {
        display: block; width: 100%; text-align: left; cursor: pointer;
        padding: 16px 18px; margin-bottom: 12px; border-radius: 12px;
        border: 1px solid var(--border-light); background: rgba(19, 45, 68, 0.7);
        color: inherit; font: inherit;
      }
      .tx-blast-card:hover { border-color: var(--text-accent); }
      .tx-blast-top { display: flex; align-items: baseline; justify-content: space-between; gap: 12px; flex-wrap: wrap; }
      .tx-blast-name {
        font-family: "Montserrat", sans-serif; font-size: 16px; font-weight: 800; color: var(--text-white);
      }
      .tx-blast-meta { font-size: 12px; color: var(--text-muted); margin-top: 3px; }
      .tx-blast-counts {
        font-family: "Montserrat", sans-serif; font-size: 12px; font-weight: 700;
        color: var(--text-accent); font-variant-numeric: tabular-nums; white-space: nowrap;
      }

      /* ---- Progress meter (pride gradient) ---- */
      .tx-meter {
        height: 8px; border-radius: 999px; margin-top: 12px; overflow: hidden;
        background: rgba(255, 255, 255, 0.08);
      }
      .tx-meter-fill {
        height: 100%; border-radius: 999px; transition: width 0.25s ease;
        background: linear-gradient(135deg,#E40303,#FFBC00,#FFED00,#008026,#004DFF,#750787);
        background-size: 220% 100%;
      }

      /* ---- Sticky runner header ---- */
      .tx-sticky {
        position: sticky; top: 0; z-index: 20; margin: 0 0 16px;
        padding: 12px 14px; border-radius: 12px;
        border: 1px solid var(--border-light);
        background: rgba(10, 24, 36, 0.96);
        backdrop-filter: blur(6px);
      }
      .tx-sticky-top {
        display: flex; align-items: center; justify-content: space-between; gap: 10px; flex-wrap: wrap;
      }
      .tx-queue-count {
        font-family: "Montserrat", sans-serif; font-size: 13px; font-weight: 800;
        color: var(--text-white); font-variant-numeric: tabular-nums;
      }
      .tx-queue-sub { font-size: 11px; color: var(--text-muted); }

      .tx-chips { display: flex; gap: 6px; flex-wrap: wrap; margin-top: 10px; }
      .tx-chip {
        font-family: "Montserrat", sans-serif; font-size: 10px; font-weight: 800;
        letter-spacing: 0.5px; text-transform: uppercase; padding: 6px 11px; border-radius: 999px;
        border: 1px solid var(--border-medium); background: rgba(15, 34, 51, 0.6);
        color: var(--text-light); cursor: pointer; white-space: nowrap;
      }
      .tx-chip.is-on { border-color: var(--text-accent); color: var(--text-accent); background: rgba(112,214,236,0.12); }

      /* ---- Person card ---- */
      .tx-card {
        padding: 18px; border-radius: 14px; margin-bottom: 14px;
        border: 1px solid var(--border-light); background: rgba(19, 45, 68, 0.85);
      }
      .tx-card.is-sent    { opacity: 0.55; border-color: rgba(95, 227, 161, 0.35); }
      .tx-card.is-skipped { opacity: 0.55; }

      .tx-person-name {
        font-family: "Montserrat", sans-serif; font-size: 20px; font-weight: 800;
        color: var(--text-white); line-height: 1.2;
      }
      .tx-person-sub { font-size: 12px; color: var(--text-muted); margin-top: 4px; }
      .tx-badges { display: flex; gap: 5px; flex-wrap: wrap; margin-top: 9px; }
      .tx-badge {
        display: inline-flex; align-items: center; gap: 4px;
        font-family: "Montserrat", sans-serif; font-size: 9px; font-weight: 800;
        letter-spacing: 0.6px; text-transform: uppercase; padding: 3px 8px; border-radius: 4px;
        background: rgba(112,214,236,0.16); color: var(--text-accent);
      }
      .tx-badge-warn  { background: rgba(255,199,115,0.18); color: #ffc773; }
      .tx-badge-good  { background: rgba(95,227,161,0.16);  color: #5fe3a1; }
      .tx-badge-alert { background: rgba(155,44,44,0.25);   color: #ff9d9d; }

      .tx-warn {
        margin-top: 12px; padding: 10px 12px; border-radius: 8px; font-size: 12px;
        line-height: 1.5; border: 1px solid rgba(255,199,115,0.4);
        background: rgba(255,199,115,0.08); color: rgba(255,255,255,0.85);
      }
      .tx-warn strong { color: #ffc773; }
      .tx-warn-alert { border-color: rgba(255,157,157,0.45); background: rgba(155,44,44,0.14); }
      .tx-warn-alert strong { color: #ff9d9d; }

      .tx-phone-row { display: flex; align-items: center; gap: 10px; flex-wrap: wrap; margin-top: 14px; }
      .tx-phone {
        font-family: "Montserrat", sans-serif; font-size: 17px; font-weight: 700;
        color: var(--text-white); font-variant-numeric: tabular-nums; letter-spacing: 0.4px;
      }

      .tx-msg {
        width: 100%; min-height: 132px; margin-top: 12px; padding: 12px 13px;
        border-radius: 10px; border: 1px solid var(--border-medium);
        background: rgba(10, 24, 36, 0.85); color: var(--text-white);
        font-family: "Roboto Slab", Georgia, serif; font-size: 15px; line-height: 1.55;
        resize: vertical;
      }
      .tx-msg:focus { outline: none; border-color: var(--text-accent); box-shadow: 0 0 0 2px rgba(112,214,236,0.18); }

      .tx-msg-meta {
        display: flex; align-items: center; justify-content: space-between; gap: 10px;
        flex-wrap: wrap; margin-top: 6px; font-size: 11px; color: var(--text-muted);
        font-variant-numeric: tabular-nums;
      }
      .tx-edited { color: #ffc773; font-weight: 700; }

      /* ---- Buttons: big touch targets ---- */
      .tx-actions { display: flex; gap: 9px; flex-wrap: wrap; margin-top: 14px; }
      .tx-btn {
        flex: 1 1 auto; min-height: 50px; min-width: 130px;
        display: inline-flex; align-items: center; justify-content: center; gap: 8px;
        padding: 13px 16px; border-radius: 10px; cursor: pointer;
        font-family: "Montserrat", sans-serif; font-size: 13px; font-weight: 800;
        letter-spacing: 0.5px; text-transform: uppercase; text-decoration: none;
        border: 1px solid var(--border-medium); background: rgba(15, 34, 51, 0.7);
        color: var(--text-light); -webkit-tap-highlight-color: transparent;
      }
      .tx-btn:hover { border-color: var(--text-accent); color: var(--text-accent); }
      .tx-btn-copy {
        border-color: rgba(112,214,236,0.55); color: #0f2233; background: var(--text-accent);
      }
      .tx-btn-copy:hover { background: #8fe1f2; color: #0f2233; border-color: #8fe1f2; }
      .tx-btn-copy.is-done { background: #5fe3a1; border-color: #5fe3a1; color: #0a1824; }
      .tx-btn-next {
        width: 100%; flex: 1 1 100%; min-height: 58px; font-size: 14px;
        background: #5fe3a1; border-color: #5fe3a1; color: #0a1824;
      }
      .tx-btn-next:hover { background: #7bebb3; border-color: #7bebb3; color: #0a1824; }
      .tx-btn-small {
        flex: 0 0 auto; min-height: 40px; min-width: 0; padding: 9px 13px; font-size: 11px;
      }
      .tx-btn-link {
        flex: 0 0 auto; min-height: 40px; min-width: 0; padding: 9px 13px; font-size: 11px;
        background: transparent; border-style: dashed;
      }

      /* ---- Undo toast ---- */
      .tx-undo {
        position: fixed; left: 50%; bottom: 22px; transform: translateX(-50%) translateY(140%);
        z-index: 90; display: flex; align-items: center; gap: 14px;
        padding: 12px 16px; border-radius: 10px; max-width: calc(100vw - 32px);
        border: 1px solid var(--border-medium); background: #0a1824;
        box-shadow: 0 12px 32px rgba(0,0,0,0.5);
        transition: transform 0.22s ease; pointer-events: none;
      }
      .tx-undo.is-on { transform: translateX(-50%) translateY(0); pointer-events: auto; }
      .tx-undo-text { font-size: 13px; color: var(--text-light); }
      .tx-undo-btn {
        font-family: "Montserrat", sans-serif; font-size: 11px; font-weight: 800;
        letter-spacing: 0.6px; text-transform: uppercase; padding: 8px 13px; border-radius: 7px;
        border: 1px solid var(--text-accent); background: transparent; color: var(--text-accent); cursor: pointer;
      }

      /* ---- Done state ---- */
      .tx-done {
        padding: 34px 22px; border-radius: 14px; text-align: center;
        border: 1px solid rgba(95,227,161,0.35); background: rgba(95,227,161,0.06);
      }
      .tx-done h2 {
        margin: 0 0 8px; font-family: "Montserrat", sans-serif; font-size: 22px;
        font-weight: 800; color: var(--text-white);
      }
      .tx-done p { margin: 0 0 18px; font-size: 14px; color: var(--text-light); }

      /* ---- Compose / build drawer ---- */
      .tx-field { margin-bottom: 14px; }
      .tx-field label {
        display: block; font-family: "Montserrat", sans-serif; font-size: 11px; font-weight: 700;
        letter-spacing: 0.4px; text-transform: uppercase; color: var(--text-muted); margin-bottom: 5px;
      }
      .tx-field-hint { font-size: 11px; color: var(--text-muted); margin-top: 5px; line-height: 1.5; }
      .tx-grid2 { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; }
      .tx-check { display: flex; align-items: flex-start; gap: 9px; font-size: 13px; color: var(--text-light); margin-bottom: 10px; }
      .tx-check input { width: 17px; height: 17px; margin-top: 1px; flex: 0 0 auto; }
      .tx-preview {
        margin-top: 8px; padding: 12px 14px; border-radius: 10px;
        border: 1px solid var(--border-light); background: rgba(10, 24, 36, 0.7);
        font-family: "Roboto Slab", Georgia, serif; font-size: 14px; line-height: 1.55;
        color: var(--text-light); white-space: pre-wrap; word-break: break-word;
      }
      .tx-count-pill {
        display: inline-flex; align-items: baseline; gap: 7px; padding: 9px 14px; border-radius: 8px;
        border: 1px solid rgba(112,214,236,0.4); background: rgba(112,214,236,0.09);
      }
      .tx-count-num {
        font-family: "Montserrat", sans-serif; font-size: 21px; font-weight: 800;
        color: var(--text-accent); font-variant-numeric: tabular-nums; line-height: 1;
      }
      .tx-count-label { font-size: 12px; color: var(--text-light); }

      /* ---- Full list mode ---- */
      .tx-row {
        display: flex; align-items: center; gap: 12px; width: 100%; text-align: left;
        padding: 12px 14px; margin-bottom: 8px; border-radius: 10px; cursor: pointer;
        border: 1px solid var(--border-light); background: rgba(19, 45, 68, 0.6);
        color: inherit; font: inherit;
      }
      .tx-row:hover { border-color: var(--text-accent); }
      .tx-row-dot { width: 9px; height: 9px; border-radius: 50%; flex: 0 0 auto; background: var(--text-muted); }
      .tx-row-dot.is-sent    { background: #5fe3a1; }
      .tx-row-dot.is-skipped { background: #ffc773; }
      .tx-row-main { flex: 1 1 auto; min-width: 0; }
      .tx-row-name { font-family: "Montserrat", sans-serif; font-size: 14px; font-weight: 700; color: var(--text-white); }
      .tx-row-sub { font-size: 11px; color: var(--text-muted); margin-top: 2px; }
      .tx-row-idx {
        font-family: "Montserrat", sans-serif; font-size: 11px; font-weight: 800;
        color: var(--text-muted); font-variant-numeric: tabular-nums; flex: 0 0 auto;
      }

      .tx-guardrail {
        margin-top: 20px; padding: 14px 16px; border-radius: 10px; font-size: 12px; line-height: 1.6;
        border: 1px solid var(--border-light); background: rgba(15, 34, 51, 0.5); color: var(--text-muted);
      }
      .tx-guardrail strong { color: var(--text-light); }

      @media (max-width: 640px) {
        .tx-grid2 { grid-template-columns: 1fr; }
        .tx-person-name { font-size: 18px; }
        .tx-btn { min-width: 100%; }
        .tx-btn-small, .tx-btn-link { min-width: 0; }
      }
    </style>
  </head>

  <body class="admin-shell">
    <div
      id="shell-root"
      data-active-nav="texting"
      data-page-eyebrow="Comms"
      data-page-title="Text Blast"
      data-page-sub="Person-to-person texting. One card per person, copy and paste into Messages. Nothing sends automatically."
    ></div>

    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <script src="/admin/admin-shell.js"></script>

    <script>
      (function () {
        'use strict';

        // -------------------------------------------------------------
        // Message template. {first} swaps in each first name; anyone
        // without one falls back to "Hi there".
        //
        // House voice: warm, short, sounds like one human texting
        // another. Link on its own line. No em or en dashes, no
        // hashtags, no emojis unless Zach types them in.
        // -------------------------------------------------------------
        var DEFAULT_TPL =
          "Hi {first}, it's Zach with Ohio Pride PAC. Wanted to reach out personally " +
          "about what we have coming up this month.\n\n" +
          "https://ohiopride.org\n\n" +
          "Would love to hear what you think.";

        // Segments map onto contacts.roles[]. Adding one is a line here.
        var SEGMENTS = [
          { key: 'founding_members', label: 'Founding members', role: 'founding_member' },
          { key: 'volunteers',       label: 'Volunteers',       role: 'volunteer' },
          { key: 'donors',           label: 'Donors',           role: 'donor' },
          { key: 'signups',          label: 'Event sign-ups',   role: 'signup' },
          { key: 'launch_signups',   label: 'Launch day sign-ups', role: 'launch_signup' },
          { key: 'network',          label: 'Network contacts', role: 'network' },
          { key: 'press',            label: 'Press',            role: 'press' },
          { key: 'newsletter',       label: 'Newsletter',       role: 'newsletter' },
          { key: 'all',              label: 'Everyone with a phone', role: null }
        ];

        var REGIONS = [
          'Northeast Ohio','Northwest Ohio','Central Ohio','Southwest Ohio','Southeast Ohio'
        ];

        // Ohio area codes. Anything else gets an out-of-state flag on the
        // card so Zach knows before he taps, rather than after.
        var OHIO_AREA_CODES = {
          '216':1,'220':1,'234':1,'283':1,'326':1,'330':1,'380':1,'419':1,
          '436':1,'440':1,'513':1,'567':1,'614':1,'740':1,'937':1
        };

        // Firewall names: event and thank-you content only. Nothing that
        // reads as campaign coordination or express advocacy.
        var FIREWALL = ['walsh', 'russo', 'acton'];

        var EMAIL_TYPOS = ['gmial.','gmai.','gmal.','yaho.','yahooo.','hotmial.','hotmai.','outlok.','.con','.cmo','.ocm','.vom'];

        var FLAG_LABEL = {
          no_optin:     { text: 'No SMS opt-in', cls: 'tx-badge-warn' },
          firewall:     { text: 'Firewall name', cls: 'tx-badge-alert' },
          gov_email:    { text: 'Gov email',     cls: 'tx-badge-alert' },
          out_of_state: { text: 'Out of state',  cls: 'tx-badge-warn' },
          email_typo:   { text: 'Email typo?',   cls: 'tx-badge-warn' },
          bad_phone:    { text: 'Bad number',    cls: 'tx-badge-alert' },
          email_only:   { text: 'Email only',    cls: 'tx-badge-warn' },
          dual_email:   { text: 'Gov + personal', cls: 'tx-badge-warn' }
        };

        var state = {
          client: null,
          canWrite: false,
          actorEmail: '',
          view: 'list',
          blasts: [],
          blast: null,
          recipients: [],
          filter: 'queued',       // queued | sent | skipped | all
          mode: 'rapid',          // rapid | list
          index: 0,
          undoTimer: null,
          undoRow: null,
          saveTimer: null,
          preview: null           // staged recipients from the build drawer
        };

        function $(id) { return document.getElementById(id); }
        function esc(s) {
          return String(s == null ? '' : s).replace(/[&<>"']/g, function (c) {
            return { '&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;' }[c];
          });
        }
        function escAttr(s) { return esc(s).replace(/"/g, '&quot;'); }
        function toast(msg, kind) {
          if (window.AdminShell && window.AdminShell.toast) window.AdminShell.toast(msg, kind);
        }
        function fmtDate(iso) {
          if (!iso) return '';
          var d = new Date(iso);
          if (isNaN(d.getTime())) return '';
          return d.toLocaleDateString('en-US', { month: 'short', day: 'numeric', year: 'numeric' });
        }

        // -------------------------------------------------------------
        // Phone + message helpers
        // -------------------------------------------------------------

        // E.164 or nothing. Strip non-digits, drop a leading 1, require
        // exactly 10 digits. Anything else is not textable.
        function normalizePhone(raw) {
          var d = String(raw == null ? '' : raw).replace(/[^0-9]/g, '');
          if (d.length === 11 && d.charAt(0) === '1') d = d.slice(1);
          if (d.length !== 10) return null;
          if (d.charAt(0) === '0' || d.charAt(0) === '1') return null;
          return '+1' + d;
        }
        function prettyPhone(e164) {
          if (!e164) return '';
          var d = e164.replace(/[^0-9]/g, '').slice(-10);
          if (d.length !== 10) return e164;
          return '(' + d.slice(0,3) + ') ' + d.slice(3,6) + '-' + d.slice(6);
        }
        function areaCode(e164) {
          if (!e164) return '';
          return e164.replace(/[^0-9]/g, '').slice(-10, -7);
        }

        // iPhone and Mac want &body=, Android and Chrome want ?body=.
        function smsHref(e164, body) {
          var sep = /iPad|iPhone|iPod|Macintosh/.test(navigator.userAgent) ? '&' : '?';
          return 'sms:' + e164 + sep + 'body=' + encodeURIComponent(body);
        }
        function mailtoHref(addr, subject, body) {
          return 'mailto:' + encodeURIComponent(addr) +
            '?subject=' + encodeURIComponent(subject || '') +
            '&body=' + encodeURIComponent(body || '');
        }

        function renderMessage(row, tpl) {
          if (row.message_override != null && row.message_override !== '') return row.message_override;
          var first = (row.first_name || '').trim();
          var body = tpl == null ? (state.blast ? state.blast.template : DEFAULT_TPL) : tpl;
          return first
            ? body.replace(/\{first\}/g, first)
            : body.replace(/Hi \{first\},/g, 'Hi there,').replace(/\{first\}/g, 'there');
        }

        // Rough segment math so a long message is obvious before sending.
        // GSM-7 fits 160 (153 concatenated); anything outside it forces
        // UCS-2 at 70 (67 concatenated).
        function segmentInfo(text) {
          var s = String(text || '');
          var gsm = /^[A-Za-z0-9@£$¥èéùìòÇØøÅå\u0394_\u03A6\u0393\u039B\u03A9\u03A0\u03A8\u03A3\u0398\u039EÆæßÉ !"#¤%&'()*+,\-./:;<=>?¡ÄÖÑÜ§¿äöñüà^{}\\\[~\]|€\r\n]*$/.test(s);
          var per = gsm ? 160 : 70, cat = gsm ? 153 : 67;
          var count = s.length <= per ? 1 : Math.ceil(s.length / cat);
          return { chars: s.length, segments: count, unicode: !gsm };
        }

        function copyText(text) {
          if (navigator.clipboard && navigator.clipboard.writeText) {
            return navigator.clipboard.writeText(text);
          }
          return new Promise(function (resolve, reject) {
            try {
              var ta = document.createElement('textarea');
              ta.value = text;
              ta.setAttribute('readonly', '');
              ta.style.position = 'fixed';
              ta.style.opacity = '0';
              document.body.appendChild(ta);
              ta.select();
              ta.setSelectionRange(0, text.length);
              var ok = document.execCommand('copy');
              document.body.removeChild(ta);
              ok ? resolve() : reject(new Error('copy failed'));
            } catch (err) { reject(err); }
          });
        }

        // -------------------------------------------------------------
        // Flags. Surfaced on the card, never silently acted on.
        // -------------------------------------------------------------
        function computeFlags(person, phone) {
          var flags = [];
          var email = String(person.email || '').toLowerCase();
          var last = String(person.last_name || '').toLowerCase().trim();
          if (!last) {
            var parts = String(person.name || person.full_name || '').trim().split(/\s+/);
            last = (parts.length > 1 ? parts[parts.length - 1] : '').toLowerCase();
          }

          if (!phone) flags.push(person.email ? 'email_only' : 'bad_phone');
          else if (!OHIO_AREA_CODES[areaCode(phone)]) flags.push('out_of_state');

          if (!person.sms_optin) flags.push('no_optin');
          if (FIREWALL.indexOf(last) !== -1) flags.push('firewall');
          if (/\.gov$|\.state\.oh\.us$/.test(email)) flags.push('gov_email');
          if (email && EMAIL_TYPOS.some(function (t) { return email.indexOf(t) !== -1; })) flags.push('email_typo');

          return flags;
        }

        // -------------------------------------------------------------
        // Boot
        // -------------------------------------------------------------
        document.addEventListener('admin-shell-ready', function (ev) {
          var detail = ev.detail || {};
          state.client = detail.client;
          state.actorEmail = (detail.session && detail.session.user && detail.session.user.email) || '';

          Promise.all([
            state.client.rpc('has_permission', { p_module: 'texting', p_action: 'read'  }),
            state.client.rpc('has_permission', { p_module: 'texting', p_action: 'write' })
          ]).then(function (res) {
            var canRead = res[0] && res[0].data === true;
            state.canWrite = res[1] && res[1].data === true;
            if (!canRead) { renderDenied(); return; }

            var param = new URLSearchParams(window.location.search).get('blast');
            if (param) return openBlast(param);
            return loadBlastList();
          }).catch(function (err) {
            console.error('texting gate failed', err);
            renderDenied();
          });
        });

        function renderDenied() {
          $('shellBody').innerHTML =
            '<div class="admin-panel"><div class="admin-panel-empty">' +
              '<div class="admin-panel-empty-eyebrow">Restricted</div>' +
              '<h2>You don&rsquo;t have access to text blasts</h2>' +
              '<p>The <code>texting</code> module reaches personal cell numbers, so it is limited to ' +
              'the Director, comms lead, and volunteer lead. Ask the Director if you need access.</p>' +
            '</div></div>';
        }

        // -------------------------------------------------------------
        // Blast list
        // -------------------------------------------------------------
        function loadBlastList() {
          state.view = 'list';
          state.blast = null;
          state.recipients = [];
          $('shellPageActions').innerHTML = state.canWrite
            ? '<button type="button" class="shell-btn shell-btn-primary" id="newBlastBtn">New blast</button>'
            : '';
          $('shellBody').innerHTML =
            '<div class="tx-gradient-bar" aria-hidden="true"></div>' +
            '<div id="blastList"><p class="admin-loading">Loading blasts&hellip;</p></div>' +
            guardrailHtml();

          var newBtn = $('newBlastBtn');
          if (newBtn) newBtn.addEventListener('click', openBuildDrawer);

          return Promise.all([
            state.client.from('text_blasts')
              .select('id, name, audience_label, template, is_fundraising, status, created_by, created_at')
              .order('created_at', { ascending: false })
              .limit(100),
            state.client.from('text_blast_progress').select('*')
          ]).then(function (res) {
            if (res[0].error) throw res[0].error;
            var progress = {};
            (res[1].data || []).forEach(function (p) { progress[p.blast_id] = p; });
            state.blasts = (res[0].data || []).map(function (b) {
              b.progress = progress[b.id] || { total: 0, sent: 0, skipped: 0, queued: 0 };
              return b;
            });
            renderBlastList();
          }).catch(function (err) {
            console.error('load blasts failed', err);
            $('blastList').innerHTML = '<p class="admin-error">Could not load blasts. ' + esc(err.message || '') + '</p>';
          });
        }

        function renderBlastList() {
          if (!state.blasts.length) {
            $('blastList').innerHTML =
              '<div class="admin-panel"><div class="admin-panel-empty">' +
                '<div class="admin-panel-empty-eyebrow">Nothing yet</div>' +
                '<h2>No text blasts built</h2>' +
                '<p>Pick a segment, write the message once, and this builds a queue you work ' +
                'through one card at a time. You press send in Messages every time.</p>' +
              '</div></div>';
            return;
          }

          $('blastList').innerHTML = state.blasts.map(function (b) {
            var p = b.progress;
            var total = Number(p.total) || 0;
            var done = (Number(p.sent) || 0) + (Number(p.skipped) || 0);
            var pct = total ? Math.round((done / total) * 100) : 0;
            return '' +
              '<button type="button" class="tx-blast-card" data-blast="' + escAttr(b.id) + '">' +
                '<div class="tx-blast-top">' +
                  '<div>' +
                    '<div class="tx-blast-name">' + esc(b.name) + '</div>' +
                    '<div class="tx-blast-meta">' +
                      esc(b.audience_label) + ' &middot; built ' + esc(fmtDate(b.created_at)) +
                      (b.status === 'archived' ? ' &middot; archived' : '') +
                      (b.is_fundraising ? ' &middot; fundraising' : '') +
                    '</div>' +
                  '</div>' +
                  '<div class="tx-blast-counts">' + p.sent + ' sent / ' + total + '</div>' +
                '</div>' +
                '<div class="tx-meter"><div class="tx-meter-fill" style="width:' + pct + '%"></div></div>' +
              '</button>';
          }).join('');

          Array.prototype.forEach.call($('blastList').querySelectorAll('[data-blast]'), function (el) {
            el.addEventListener('click', function () { openBlast(el.getAttribute('data-blast')); });
          });
        }

        function guardrailHtml() {
          return '' +
            '<div class="tx-guardrail">' +
              '<strong>How this works.</strong> Every message is sent by you, from your phone, in Messages. ' +
              'Nothing here dispatches anything and no carrier API is involved. Most of these contacts have a ' +
              'phone on file but never checked the SMS box, which is exactly why this is person to person and ' +
              'not a bulk gateway. Names and numbers stay inside the admin: do not paste a queue anywhere public.' +
            '</div>';
        }

        // -------------------------------------------------------------
        // Build a blast
        // -------------------------------------------------------------
        function openBuildDrawer() {
          var segOpts = SEGMENTS.map(function (s) {
            return '<option value="' + escAttr(s.key) + '">' + esc(s.label) + '</option>';
          }).join('');
          var regionOpts = '<option value="">Every region</option>' + REGIONS.map(function (r) {
            return '<option value="' + escAttr(r) + '">' + esc(r) + '</option>';
          }).join('');

          window.AdminShell.openDrawer({
            title: 'New text blast',
            eyebrow: 'Pick the segment, write the message once',
            bodyHtml: [
              '<div class="tx-field">',
                '<label for="bName">Blast name</label>',
                '<input type="text" class="admin-input" id="bName" placeholder="August founding member check-in" />',
              '</div>',
              '<div class="tx-grid2">',
                '<div class="tx-field">',
                  '<label for="bSegment">Audience</label>',
                  '<select class="admin-input" id="bSegment">' + segOpts + '</select>',
                '</div>',
                '<div class="tx-field">',
                  '<label for="bRegion">Region</label>',
                  '<select class="admin-input" id="bRegion">' + regionOpts + '</select>',
                '</div>',
              '</div>',
              '<div class="tx-grid2">',
                '<div class="tx-field">',
                  '<label for="bCounty">County contains</label>',
                  '<input type="text" class="admin-input" id="bCounty" placeholder="Hamilton" />',
                '</div>',
                '<div class="tx-field">',
                  '<label for="bTag">Tag contains</label>',
                  '<input type="text" class="admin-input" id="bTag" placeholder="pride-tour" />',
                '</div>',
              '</div>',

              '<div class="tx-check">',
                '<input type="checkbox" id="bOptinOnly" />',
                '<label for="bOptinOnly" style="text-transform:none;letter-spacing:0;font-size:13px;color:var(--text-light);font-family:inherit;font-weight:400;margin:0;">',
                  'SMS opt-in only. Off by default because most contacts never saw an SMS box; ',
                  'person-to-person from your own phone is the model precisely because of that.',
                '</label>',
              '</div>',
              '<div class="tx-check">',
                '<input type="checkbox" id="bIncludeEmail" />',
                '<label for="bIncludeEmail" style="text-transform:none;letter-spacing:0;font-size:13px;color:var(--text-light);font-family:inherit;font-weight:400;margin:0;">',
                  'Include people with no usable phone as an email branch.',
                '</label>',
              '</div>',
              '<div class="tx-check">',
                '<input type="checkbox" id="bFundraising" />',
                '<label for="bFundraising" style="text-transform:none;letter-spacing:0;font-size:13px;color:var(--text-light);font-family:inherit;font-weight:400;margin:0;">',
                  'This blast asks for money. Government addresses are blocked from the email branch.',
                '</label>',
              '</div>',

              '<div class="tx-field">',
                '<label for="bTemplate">Message. {first} swaps in each first name</label>',
                '<textarea class="tx-msg" id="bTemplate" style="min-height:150px">' + esc(DEFAULT_TPL) + '</textarea>',
                '<div class="tx-msg-meta"><span id="bTplMeta"></span></div>',
                '<div class="tx-field-hint">Link on its own line. No em dashes, no hashtags, no ' +
                  '&ldquo;Paid for by&rdquo; line on texts.</div>',
              '</div>',
              '<div class="tx-field">',
                '<label>Preview</label>',
                '<div class="tx-preview" id="bPreview"></div>',
              '</div>',

              '<div class="tx-field" id="bCountWrap" hidden>',
                '<label>Queue</label>',
                '<div class="tx-count-pill">',
                  '<span class="tx-count-num" id="bCountNum">0</span>',
                  '<span class="tx-count-label" id="bCountLabel">people</span>',
                '</div>',
                '<div class="tx-field-hint" id="bFlagSummary"></div>',
              '</div>'
            ].join(''),
            footHtml: '' +
              '<button type="button" class="shell-btn shell-btn-outline" id="bPreviewBtn">Preview list</button>' +
              '<button type="button" class="shell-btn shell-btn-primary" id="bBuildBtn" disabled>Build queue</button>'
          });

          var tpl = $('bTemplate');
          function syncPreview() {
            var t = tpl.value;
            $('bPreview').textContent = t.replace(/\{first\}/g, 'Nicole');
            var info = segmentInfo(t.replace(/\{first\}/g, 'Nicole'));
            $('bTplMeta').textContent =
              info.chars + ' characters · ' +
              info.segments + (info.segments === 1 ? ' segment' : ' segments') +
              (info.unicode ? ' · unicode, shorter segments' : '');
          }
          tpl.addEventListener('input', function () {
            syncPreview();
            $('bBuildBtn').disabled = true;
            $('bCountWrap').hidden = true;
          });
          syncPreview();

          ['bSegment','bRegion','bCounty','bTag','bOptinOnly','bIncludeEmail'].forEach(function (id) {
            $(id).addEventListener('change', function () {
              $('bBuildBtn').disabled = true;
              $('bCountWrap').hidden = true;
            });
          });

          $('bPreviewBtn').addEventListener('click', runPreview);
          $('bBuildBtn').addEventListener('click', buildBlast);
        }

        function drawerFilters() {
          return {
            segment: $('bSegment').value,
            region: $('bRegion').value.trim(),
            county: $('bCounty').value.trim(),
            tag: $('bTag').value.trim(),
            optin_only: $('bOptinOnly').checked,
            include_email: $('bIncludeEmail').checked
          };
        }

        function runPreview() {
          var f = drawerFilters();
          var seg = SEGMENTS.filter(function (s) { return s.key === f.segment; })[0] || SEGMENTS[0];
          var btn = $('bPreviewBtn');
          btn.disabled = true;
          btn.textContent = 'Loading...';

          var q = state.client.from('contacts')
            .select('id, name, full_name, first_name, last_name, email, phone, city, county, region, sms_optin, tags')
            .eq('is_merged', false)
            .not('do_not_contact', 'is', true)
            .order('name', { ascending: true })
            .limit(2000);

          if (seg.role) q = q.contains('roles', [seg.role]);
          if (f.region) q = q.eq('region', f.region);
          if (f.county) q = q.ilike('county', '%' + f.county + '%');
          if (f.tag)    q = q.contains('tags', [f.tag]);
          if (f.optin_only) q = q.eq('sms_optin', true);

          q.then(function (resp) {
            btn.disabled = false;
            btn.textContent = 'Preview list';
            if (resp.error) { toast('Preview failed: ' + resp.error.message, 'error'); return; }

            var rows = [];
            (resp.data || []).forEach(function (c) {
              var phone = normalizePhone(c.phone);
              var flags = computeFlags(c, phone);
              if (!phone) {
                if (!f.include_email || !c.email) return;
              }
              rows.push({
                contact_id: c.id,
                full_name: c.full_name || c.name || [c.first_name, c.last_name].filter(Boolean).join(' ') || 'Unnamed',
                first_name: c.first_name || '',
                phone_e164: phone,
                email: c.email ? String(c.email) : null,
                city: c.city || null,
                county: c.county || null,
                region: c.region || null,
                sms_optin: !!c.sms_optin,
                channel: phone ? 'sms' : 'email',
                flags: flags
              });
            });

            state.preview = { rows: rows, filters: f, segment: seg };
            var counts = {};
            rows.forEach(function (r) {
              r.flags.forEach(function (fl) { counts[fl] = (counts[fl] || 0) + 1; });
            });
            var summary = Object.keys(counts).map(function (k) {
              return (FLAG_LABEL[k] ? FLAG_LABEL[k].text : k) + ': ' + counts[k];
            }).join(' · ');

            $('bCountWrap').hidden = false;
            $('bCountNum').textContent = rows.length;
            $('bCountLabel').textContent = rows.length === 1 ? 'person in the queue' : 'people in the queue';
            $('bFlagSummary').textContent = summary || 'No data flags on this segment.';
            $('bBuildBtn').disabled = rows.length === 0 || !state.canWrite;
            if (!state.canWrite) toast('You have read access only', 'error');
          });
        }

        function buildBlast() {
          if (!state.preview || !state.preview.rows.length) return;
          var name = ($('bName').value || '').trim();
          var tplText = $('bTemplate').value;
          if (!name) { toast('Give the blast a name', 'error'); $('bName').focus(); return; }
          if (!tplText.trim()) { toast('The message is empty', 'error'); return; }

          var f = state.preview.filters;
          var seg = state.preview.segment;
          var btn = $('bBuildBtn');
          btn.disabled = true;
          btn.textContent = 'Building...';

          state.client.from('text_blasts').insert({
            name: name,
            audience_key: seg.key,
            audience_label: seg.label,
            template: tplText,
            filters: f,
            is_fundraising: $('bFundraising').checked,
            created_by: state.actorEmail
          }).select('id').single().then(function (resp) {
            if (resp.error) throw resp.error;
            var blastId = resp.data.id;
            var payload = state.preview.rows.map(function (r, i) {
              return {
                blast_id: blastId,
                contact_id: r.contact_id,
                queue_order: i,
                full_name: r.full_name,
                first_name: r.first_name,
                phone_e164: r.phone_e164,
                email: r.email,
                city: r.city,
                county: r.county,
                region: r.region,
                sms_optin: r.sms_optin,
                channel: r.channel,
                flags: r.flags
              };
            });
            // Chunked so a large segment does not hit a single oversized request.
            var chunks = [];
            for (var i = 0; i < payload.length; i += 250) chunks.push(payload.slice(i, i + 250));
            return chunks.reduce(function (chain, chunk) {
              return chain.then(function () {
                return state.client.from('text_blast_recipients').insert(chunk).then(function (r) {
                  if (r.error) throw r.error;
                });
              });
            }, Promise.resolve()).then(function () { return blastId; });
          }).then(function (blastId) {
            window.AdminShell.closeDrawer();
            toast('Queue built', 'success');
            state.preview = null;
            openBlast(blastId);
          }).catch(function (err) {
            console.error('build blast failed', err);
            btn.disabled = false;
            btn.textContent = 'Build queue';
            toast('Could not build the queue: ' + (err.message || ''), 'error');
          });
        }

        // -------------------------------------------------------------
        // Runner
        // -------------------------------------------------------------
        function openBlast(blastId) {
          state.view = 'run';
          state.mode = 'rapid';
          state.filter = 'queued';
          state.index = 0;
          $('shellBody').innerHTML = '<p class="admin-loading">Loading queue&hellip;</p>';

          return Promise.all([
            state.client.from('text_blasts').select('*').eq('id', blastId).single(),
            state.client.from('text_blast_recipients').select('*').eq('blast_id', blastId)
              .order('queue_order', { ascending: true })
          ]).then(function (res) {
            if (res[0].error) throw res[0].error;
            if (res[1].error) throw res[1].error;
            state.blast = res[0].data;
            state.recipients = res[1].data || [];

            var url = new URL(window.location.href);
            url.searchParams.set('blast', blastId);
            window.history.replaceState({}, '', url);

            renderRunner();
          }).catch(function (err) {
            console.error('open blast failed', err);
            $('shellBody').innerHTML = '<p class="admin-error">Could not load that blast. ' + esc(err.message || '') + '</p>';
          });
        }

        function visibleRows() {
          if (state.filter === 'all') return state.recipients;
          return state.recipients.filter(function (r) { return r.status === state.filter; });
        }

        function renderRunner() {
          $('shellPageActions').innerHTML =
            '<button type="button" class="shell-btn shell-btn-ghost" id="backToListBtn">All blasts</button>' +
            (state.canWrite ? '<button type="button" class="shell-btn shell-btn-outline" id="editTplBtn">Edit message</button>' : '') +
            '<button type="button" class="shell-btn shell-btn-outline" id="downloadBtn">Phone version</button>';

          $('shellBody').innerHTML =
            '<div class="tx-gradient-bar" aria-hidden="true"></div>' +
            '<div class="tx-sticky" id="txSticky"></div>' +
            '<div id="txStage"></div>' +
            '<div class="tx-undo" id="txUndo">' +
              '<span class="tx-undo-text" id="txUndoText"></span>' +
              '<button type="button" class="tx-undo-btn" id="txUndoBtn">Undo</button>' +
            '</div>';

          $('backToListBtn').addEventListener('click', function () {
            var url = new URL(window.location.href);
            url.searchParams.delete('blast');
            window.history.replaceState({}, '', url);
            loadBlastList();
          });
          var editBtn = $('editTplBtn');
          if (editBtn) editBtn.addEventListener('click', openTemplateDrawer);
          $('downloadBtn').addEventListener('click', downloadStandalone);
          $('txUndoBtn').addEventListener('click', undoLast);

          renderSticky();
          renderStage();
        }

        function renderSticky() {
          var total = state.recipients.length;
          var sent = state.recipients.filter(function (r) { return r.status === 'sent'; }).length;
          var skipped = state.recipients.filter(function (r) { return r.status === 'skipped'; }).length;
          var queued = total - sent - skipped;
          var pct = total ? Math.round(((sent + skipped) / total) * 100) : 0;
          var rows = visibleRows();
          var pos = state.mode === 'rapid' && rows.length
            ? Math.min(state.index + 1, rows.length) + ' of ' + rows.length + ' in queue'
            : rows.length + (rows.length === 1 ? ' person' : ' people');

          $('txSticky').innerHTML = '' +
            '<div class="tx-sticky-top">' +
              '<div>' +
                '<div class="tx-queue-count">' + esc(pos) + '</div>' +
                '<div class="tx-queue-sub">' + sent + ' sent &middot; ' + skipped + ' skipped &middot; ' + queued + ' left</div>' +
              '</div>' +
              '<button type="button" class="tx-chip' + (state.mode === 'list' ? ' is-on' : '') + '" id="modeBtn">' +
                (state.mode === 'list' ? 'Rapid mode' : 'Full list') +
              '</button>' +
            '</div>' +
            '<div class="tx-meter"><div class="tx-meter-fill" style="width:' + pct + '%"></div></div>' +
            '<div class="tx-chips">' +
              chip('queued', 'Not reached', queued) +
              chip('sent', 'Sent', sent) +
              chip('skipped', 'Skipped', skipped) +
              chip('all', 'Everyone', total) +
            '</div>';

          $('modeBtn').addEventListener('click', function () {
            state.mode = state.mode === 'list' ? 'rapid' : 'list';
            state.index = 0;
            renderSticky();
            renderStage();
          });
          Array.prototype.forEach.call($('txSticky').querySelectorAll('[data-filter]'), function (el) {
            el.addEventListener('click', function () {
              state.filter = el.getAttribute('data-filter');
              state.index = 0;
              renderSticky();
              renderStage();
            });
          });
        }

        function chip(key, label, count) {
          return '<button type="button" class="tx-chip' + (state.filter === key ? ' is-on' : '') +
            '" data-filter="' + key + '">' + esc(label) + ' ' + count + '</button>';
        }

        function renderStage() {
          var rows = visibleRows();
          var stage = $('txStage');

          if (!rows.length) {
            stage.innerHTML = state.filter === 'queued'
              ? '<div class="tx-done">' +
                  '<h2>Queue drained</h2>' +
                  '<p>Everyone in this blast has been sent or skipped. Nice work.</p>' +
                  '<button type="button" class="tx-btn tx-btn-small" data-show-all>Show everyone</button>' +
                '</div>'
              : '<div class="admin-panel"><div class="admin-panel-empty"><h2>Nothing here</h2>' +
                '<p>No one matches this filter.</p></div></div>';
            var showAll = stage.querySelector('[data-show-all]');
            if (showAll) showAll.addEventListener('click', function () {
              state.filter = 'all'; state.index = 0; renderSticky(); renderStage();
            });
            return;
          }

          if (state.mode === 'list') {
            stage.innerHTML = rows.map(function (r, i) {
              return '' +
                '<button type="button" class="tx-row" data-jump="' + i + '">' +
                  '<span class="tx-row-dot is-' + esc(r.status) + '"></span>' +
                  '<span class="tx-row-main">' +
                    '<span class="tx-row-name">' + esc(r.full_name || 'Unnamed') + '</span>' +
                    '<span class="tx-row-sub">' +
                      (r.phone_e164 ? esc(prettyPhone(r.phone_e164)) : 'Email only') +
                      (r.city ? ' &middot; ' + esc(r.city) : '') +
                      (r.status !== 'queued' ? ' &middot; ' + esc(r.status) : '') +
                    '</span>' +
                  '</span>' +
                  '<span class="tx-row-idx">' + (i + 1) + '</span>' +
                '</button>';
            }).join('');
            Array.prototype.forEach.call(stage.querySelectorAll('[data-jump]'), function (el) {
              el.addEventListener('click', function () {
                state.index = Number(el.getAttribute('data-jump'));
                state.mode = 'rapid';
                renderSticky();
                renderStage();
                window.scrollTo({ top: 0, behavior: 'smooth' });
              });
            });
            return;
          }

          if (state.index >= rows.length) state.index = rows.length - 1;
          if (state.index < 0) state.index = 0;
          stage.innerHTML = cardHtml(rows[state.index]);
          bindCard(rows[state.index], rows);
        }

        function badgeHtml(flags, row) {
          var out = [];
          if (row.sms_optin) out.push('<span class="tx-badge tx-badge-good">SMS opt-in</span>');
          (flags || []).forEach(function (f) {
            var def = FLAG_LABEL[f];
            if (!def) return;
            out.push('<span class="tx-badge ' + def.cls + '">' + esc(def.text) + '</span>');
          });
          return out.join('');
        }

        function cardHtml(row) {
          var msg = renderMessage(row);
          var info = segmentInfo(msg);
          var flags = row.flags || [];
          var isEmail = row.channel === 'email' || !row.phone_e164;
          var govBlocked = state.blast.is_fundraising && flags.indexOf('gov_email') !== -1;

          var warns = '';
          if (flags.indexOf('firewall') !== -1) {
            warns += '<div class="tx-warn tx-warn-alert"><strong>Firewall name.</strong> Event logistics or a ' +
              'thank you only. Nothing that reads as campaign coordination or express advocacy.</div>';
          }
          if (flags.indexOf('gov_email') !== -1) {
            warns += '<div class="tx-warn' + (govBlocked ? ' tx-warn-alert' : '') + '"><strong>Government address on file.</strong> ' +
              (govBlocked
                ? 'This blast asks for money, so the email branch is blocked for this person. Text only, and keep it non-fundraising.'
                : 'Keep anything fundraising off this address. Check for a personal address before emailing.') +
              '</div>';
          }
          if (flags.indexOf('out_of_state') !== -1) {
            warns += '<div class="tx-warn"><strong>Out-of-state area code.</strong> Area code ' +
              esc(areaCode(row.phone_e164)) + ' is not an Ohio code. Still fine to text, just worth knowing.</div>';
          }
          if (flags.indexOf('email_typo') !== -1) {
            warns += '<div class="tx-warn"><strong>Email looks like a typo.</strong> ' + esc(row.email || '') +
              '. Fix it in Contacts rather than here.</div>';
          }

          var actions;
          if (isEmail) {
            var subject = 'A quick note from Ohio Pride PAC';
            actions =
              '<div class="tx-actions">' +
                '<button type="button" class="tx-btn tx-btn-copy" data-copy-msg>Copy message</button>' +
                (row.email && !govBlocked
                  ? '<a class="tx-btn" href="' + escAttr(mailtoHref(row.email, subject, msg)) +
                    '" target="_blank" rel="noopener">Open email</a>'
                  : '') +
              '</div>';
          } else {
            actions =
              '<div class="tx-actions">' +
                '<button type="button" class="tx-btn tx-btn-copy" data-copy-phone>Copy number</button>' +
                '<button type="button" class="tx-btn tx-btn-copy" data-copy-msg>Copy message</button>' +
              '</div>' +
              '<div class="tx-actions">' +
                '<a class="tx-btn tx-btn-link" href="' + escAttr(smsHref(row.phone_e164, msg)) +
                  '" target="_blank" rel="noopener">Try direct link</a>' +
                '<button type="button" class="tx-btn tx-btn-small" data-reset>Reset text</button>' +
              '</div>';
          }

          return '' +
            '<div class="tx-card is-' + esc(row.status) + '">' +
              '<div class="tx-person-name">' + esc(row.full_name || 'Unnamed') + '</div>' +
              '<div class="tx-person-sub">' +
                [row.city, row.county, row.region].filter(Boolean).map(esc).join(' &middot; ') +
                (row.email ? (row.city || row.county ? ' &middot; ' : '') + esc(row.email) : '') +
              '</div>' +
              '<div class="tx-badges">' + badgeHtml(flags, row) + '</div>' +
              warns +

              (isEmail
                ? '<div class="tx-phone-row"><span class="tx-phone">' +
                    (row.email ? esc(row.email) : 'No contact method') + '</span></div>'
                : '<div class="tx-phone-row"><span class="tx-phone">' + esc(prettyPhone(row.phone_e164)) + '</span>' +
                  '<span class="admin-muted" style="font-size:12px">' + esc(row.phone_e164) + '</span></div>') +

              '<textarea class="tx-msg" id="txMsg" spellcheck="true">' + esc(msg) + '</textarea>' +
              '<div class="tx-msg-meta">' +
                '<span id="txMsgMeta">' + info.chars + ' characters · ' + info.segments +
                  (info.segments === 1 ? ' segment' : ' segments') + '</span>' +
                '<span>' + (row.message_override ? '<span class="tx-edited">Edited for this person</span>' : '') + '</span>' +
              '</div>' +

              actions +

              '<div class="tx-actions">' +
                '<button type="button" class="tx-btn tx-btn-next" data-sent>' +
                  (row.status === 'sent' ? 'Already sent. Next person' : 'Sent. Next person') +
                '</button>' +
              '</div>' +
              '<div class="tx-actions">' +
                '<button type="button" class="tx-btn tx-btn-small" data-back>Back</button>' +

        }

        function bindCard(row, rows) {
          var stage = $('txStage');
          var msgEl = $('txMsg');

          function currentMsg() { return msgEl ? msgEl.value : renderMessage(row); }

          function flash(btn, label) {
            var old = btn.textContent;
            btn.textContent = label;
            btn.classList.add('is-done');
            setTimeout(function () {
              btn.textContent = old;
              btn.classList.remove('is-done');
            }, 1400);
          }

          var copyPhone = stage.querySelector('[data-copy-phone]');
          if (copyPhone) copyPhone.addEventListener('click', function () {
            copyText(row.phone_e164).then(function () { flash(copyPhone, 'Copied'); },
              function () { toast('Could not copy. Long-press the number instead.', 'error'); });
          });

          var copyMsg = stage.querySelector('[data-copy-msg]');
          if (copyMsg) copyMsg.addEventListener('click', function () {
            copyText(currentMsg()).then(function () { flash(copyMsg, 'Copied'); },
              function () { toast('Could not copy. Select the text instead.', 'error'); });
          });

          var resetBtn = stage.querySelector('[data-reset]');
          if (resetBtn) resetBtn.addEventListener('click', function () {
            saveOverride(row, null);
            renderStage();
          });

          if (msgEl) {
            msgEl.addEventListener('input', function () {
              var info = segmentInfo(msgEl.value);
              $('txMsgMeta').textContent = info.chars + ' characters · ' + info.segments +
                (info.segments === 1 ? ' segment' : ' segments');
              clearTimeout(state.saveTimer);
              state.saveTimer = setTimeout(function () {
                var base = renderMessage({ first_name: row.first_name, message_override: null });
                saveOverride(row, msgEl.value === base ? null : msgEl.value);
              }, 700);
            });
          }

          stage.querySelector('[data-sent]').addEventListener('click', function () {
            setStatus(row, 'sent');
          });
          stage.querySelector('[data-skip]').addEventListener('click', function () {
            setStatus(row, 'skipped');
          });
          stage.querySelector('[data-back]').addEventListener('click', function () {
            if (state.index > 0) { state.index--; renderSticky(); renderStage(); }
            else toast('Already at the first person', 'error');
          });
        }

        // -------------------------------------------------------------
        // Persistence
        // -------------------------------------------------------------
        function saveOverride(row, value) {
          var prev = row.message_override;
          row.message_override = value;
          if (!state.canWrite) return;
          state.client.from('text_blast_recipients')
            .update({ message_override: value }).eq('id', row.id)
            .then(function (resp) {
              if (resp.error) {
                row.message_override = prev;
                toast('Could not save that edit', 'error');
              }
            });
        }

        function setStatus(row, status) {
          if (!state.canWrite) { toast('You have read access only', 'error'); return; }
          var prev = row.status;
          row.status = status;
          row.sent_by = status === 'sent' ? state.actorEmail : null;

          var patch = { status: status };
          if (status === 'sent') patch.sent_by = state.actorEmail;

          state.client.from('text_blast_recipients').update(patch).eq('id', row.id)
            .then(function (resp) {
              if (resp.error) {
                row.status = prev;
                toast('Could not save: ' + resp.error.message, 'error');
                renderSticky();
                renderStage();
              }
            });

          // Advance. The filtered list shrinks under us when the filter is
          // "Not reached", so staying on the same index is what moves to
          // the next person.
          if (state.filter === 'all' || state.filter === status) state.index++;
          showUndo(row, prev, status);
          renderSticky();
          renderStage();
          window.scrollTo({ top: 0, behavior: 'smooth' });
        }

        function showUndo(row, prevStatus, newStatus) {
          state.undoRow = { row: row, prev: prevStatus };
          $('txUndoText').textContent =
            (row.first_name || row.full_name || 'That person') + ' marked ' + newStatus + '.';
          $('txUndo').classList.add('is-on');
          clearTimeout(state.undoTimer);
          state.undoTimer = setTimeout(function () {
            $('txUndo').classList.remove('is-on');
            state.undoRow = null;
          }, 4000);
        }

        function undoLast() {
          if (!state.undoRow) return;
          var row = state.undoRow.row, prev = state.undoRow.prev;
          state.undoRow = null;
          clearTimeout(state.undoTimer);
          $('txUndo').classList.remove('is-on');

          row.status = prev;
          state.client.from('text_blast_recipients')
            .update({ status: prev, sent_by: null }).eq('id', row.id)
            .then(function (resp) { if (resp.error) toast('Undo failed', 'error'); });

          if (state.index > 0) state.index--;
          renderSticky();
          renderStage();
        }

        // -------------------------------------------------------------
        // Edit the template. Changes everyone who has no override; the
        // queue position and every status stay put.
        // -------------------------------------------------------------
        function openTemplateDrawer() {
          window.AdminShell.openDrawer({
            title: 'Edit the message',
            eyebrow: 'Applies to everyone without a per-person edit',
            bodyHtml: [
              '<div class="tx-field">',
                '<label for="tTpl">Message. {first} swaps in each first name</label>',
                '<textarea class="tx-msg" id="tTpl" style="min-height:170px">' + esc(state.blast.template) + '</textarea>',
                '<div class="tx-msg-meta"><span id="tMeta"></span></div>',
              '</div>',
              '<div class="tx-field">',
                '<label>Preview</label>',
                '<div class="tx-preview" id="tPreview"></div>',
              '</div>',
              '<div class="tx-field-hint">',
                state.recipients.filter(function (r) { return r.message_override; }).length +
                ' people have a per-person edit. Their text is left alone.',
              '</div>'
            ].join(''),
            footHtml: '<button type="button" class="shell-btn shell-btn-primary" id="tSaveBtn">Save message</button>'
          });

          var ta = $('tTpl');
          function sync() {
            $('tPreview').textContent = ta.value.replace(/\{first\}/g, 'Nicole');
            var info = segmentInfo(ta.value.replace(/\{first\}/g, 'Nicole'));
            $('tMeta').textContent = info.chars + ' characters · ' + info.segments +
              (info.segments === 1 ? ' segment' : ' segments');
          }
          ta.addEventListener('input', sync);
          sync();

          $('tSaveBtn').addEventListener('click', function () {
            var value = ta.value;
            if (!value.trim()) { toast('The message is empty', 'error'); return; }
            state.client.from('text_blasts').update({ template: value }).eq('id', state.blast.id)
              .then(function (resp) {
                if (resp.error) { toast('Could not save: ' + resp.error.message, 'error'); return; }
                state.blast.template = value;
                window.AdminShell.closeDrawer();
                toast('Message updated', 'success');
                renderStage();
              });
          });
        }

        // -------------------------------------------------------------
        // Standalone phone version.
        //
        // Artifacts and some in-app browsers refuse to hand off sms:
        // links. A real browser tab does not. This writes the current
        // queue to a self-contained file Zach opens in Safari or Chrome,
        // where the direct links actually fire. It carries names and cell
        // numbers, so it is a local file only: never hosted, never
        // committed, never shared.
        // -------------------------------------------------------------
        function downloadStandalone() {
          var rows = state.recipients.map(function (r) {
            return {
              id: r.id, n: r.full_name, f: r.first_name, p: r.phone_e164, e: r.email,
              c: [r.city, r.county].filter(Boolean).join(', '),
              o: !!r.sms_optin, g: r.flags || [], s: r.status, m: r.message_override || null
            };
          });
          var data = {
            id: state.blast.id,
            name: state.blast.name,
            audience: state.blast.audience_label,
            tpl: state.blast.template,
            rows: rows
          };

          var html = standaloneHtml(data);
          var blob = new Blob([html], { type: 'text/html' });
          var url = URL.createObjectURL(blob);
          var a = document.createElement('a');
          a.href = url;
          a.download = 'ohio-pride-text-' +
            state.blast.name.toLowerCase().replace(/[^a-z0-9]+/g, '-').replace(/^-|-$/g, '') + '.html';
          document.body.appendChild(a);
          a.click();
          document.body.removeChild(a);
          setTimeout(function () { URL.revokeObjectURL(url); }, 4000);
          toast('Downloaded. Open it in Safari or Chrome, not in a preview pane.', 'success');
        }

          '"<div class=\\"row\\"><button class=\\"b ok\\" id=\\"ok\\">Sent. Next person</button></div>"+',
          '"<div class=\\"row\\"><button class=\\"b s\\" id=\\"bk\\">Back</button><button class=\\"b s\\" id=\\"sk\\">Skip</button></div></div>";',
          'var ta=document.getElementById("m");',
          'ta.oninput=function(){var base=msgFor({f:r.f,m:null});r.m=ta.value===base?null:ta.value;persist();',
          'var d=document.getElementById("dl");if(d)d.href=sms(r.p,ta.value);};',
          'var cp=document.getElementById("cp");if(cp)cp.onclick=function(){copy(r.p).then(function(){cp.textContent="Copied";',
          'setTimeout(function(){cp.textContent="Copy number";},1400);});};',
          'document.getElementById("cm").onclick=function(){var b=document.getElementById("cm");',
          'copy(ta.value).then(function(){b.textContent="Copied";setTimeout(function(){b.textContent="Copy message";},1400);});};',
          'document.getElementById("rs").onclick=function(){r.m=null;persist();draw();};',
          'document.getElementById("ok").onclick=function(){mark(r,"sent");};',
          'document.getElementById("sk").onclick=function(){mark(r,"skipped");};',
          'document.getElementById("bk").onclick=function(){if(st.i>0){st.i--;draw();}};}',
          'function mark(r,s){var p=r.s;r.s=s;persist();st.undo={r:r,p:p};',
          'if(st.filter==="all"||st.filter===s)st.i++;',
          'var u=document.getElementById("undo");document.getElementById("undoTxt").textContent=',
          '(r.f||r.n||"That person")+" marked "+s+".";u.classList.add("on");',
          'clearTimeout(mark.t);mark.t=setTimeout(function(){u.classList.remove("on");st.undo=null;},4000);',
          'draw();window.scrollTo(0,0);}',
          'document.getElementById("undoBtn").onclick=function(){if(!st.undo)return;',
          'st.undo.r.s=st.undo.p;st.undo=null;persist();document.getElementById("undo").classList.remove("on");',
          'if(st.i>0)st.i--;draw();};',
          'function draw(){head();stage();}',
          'draw();',
          '})();'
        ].join('\n');
      })();
    </script>
  </body>
