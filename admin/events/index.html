<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Fundraising Events | Ohio Pride PAC Admin</title>
    <meta name="robots" content="noindex,nofollow" />

    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Montserrat:wght@400;600;700;800&family=Roboto+Slab:wght@400;500&display=swap"
      rel="stylesheet"
    />
    <link rel="stylesheet" href="/css/style.css" />
    <link rel="stylesheet" href="/css/site-template.css" />
    <link rel="stylesheet" href="/admin/admin-shared.css" />
    <link rel="stylesheet" href="/admin/admin-shell.css" />
    <link rel="stylesheet" href="/admin/admin-responsive.css" />

    <style>
      /* ---- List ---- */
      .ev-table tbody tr { cursor: pointer; }
      .ev-table tbody tr:hover { background: rgba(112, 214, 236, 0.06); }
      .ev-name-cell { font-weight: 600; color: var(--text-white); }
      .ev-name-sub { font-size: 12px; color: var(--text-muted); font-weight: 400; margin-top: 3px; }
      .ev-num { font-variant-numeric: tabular-nums; text-align: right; }
      th.ev-num-h { text-align: right; }

      .ev-progress { min-width: 120px; }
      .ev-progress-bar { height: 6px; border-radius: 999px; background: rgba(255,255,255,0.08); overflow: hidden; }
      .ev-progress-fill { height: 100%; background: var(--text-accent); border-radius: 999px; }
      .ev-progress-txt { font-size: 11px; color: var(--text-muted); margin-top: 4px; font-variant-numeric: tabular-nums; }

      .admin-status-planning  { background: rgba(255,255,255,0.08); border-color: var(--border-medium); color: var(--text-muted); }
      .admin-status-active     { background: rgba(112, 214, 236, 0.15); border-color: rgba(112, 214, 236, 0.55); color: var(--text-accent); }
      .admin-status-completed  { background: rgba(74, 222, 128, 0.12); border-color: rgba(74, 222, 128, 0.55); color: #4ade80; }
      .admin-status-cancelled  { background: rgba(255, 255, 255, 0.05); border-color: var(--border-medium); color: var(--text-muted); }

      /* ---- Detail ---- */
      .ev-detail-head { display: flex; align-items: flex-start; gap: 16px; margin-bottom: 20px; flex-wrap: wrap; }
      .ev-detail-head h2 { margin: 0 0 6px; font-family: 'Montserrat', sans-serif; font-size: 22px; color: var(--text-white); }
      .ev-detail-meta { font-size: 13px; color: var(--text-muted); display: flex; gap: 14px; flex-wrap: wrap; }
      .ev-detail-meta a { color: var(--text-accent); text-decoration: none; }
      .ev-detail-meta a:hover { text-decoration: underline; }
      .ev-detail-actions { margin-left: auto; display: flex; gap: 8px; }

      .ev-kpi-grid { display: grid; grid-template-columns: repeat(6, 1fr); gap: 12px; margin-bottom: 22px; }
      .ev-kpi { background: rgba(15, 34, 51, 0.6); border: 1px solid rgba(255,255,255,0.06); border-radius: 10px; padding: 14px 16px; }
      .ev-kpi-num { font-family: 'Montserrat', sans-serif; font-weight: 700; font-size: 20px; color: var(--text-white); font-variant-numeric: tabular-nums; }
      .ev-kpi-num.is-neg { color: #ff8a8a; }
      .ev-kpi-num.is-pos { color: #4ade80; }
      .ev-kpi-label { font-family: 'Montserrat', sans-serif; font-size: 10px; letter-spacing: 1px; text-transform: uppercase; color: var(--text-muted); margin-top: 6px; }
      @media (max-width: 900px) { .ev-kpi-grid { grid-template-columns: repeat(3, 1fr); } }
      @media (max-width: 560px) { .ev-kpi-grid { grid-template-columns: repeat(2, 1fr); } }

      .ev-section { background: rgba(15, 34, 51, 0.6); border: 1px solid rgba(255,255,255,0.06); border-radius: 12px; padding: 16px 18px; margin-bottom: 20px; }
      .ev-section-head { display: flex; align-items: center; justify-content: space-between; margin-bottom: 12px; }
      .ev-section-head h3 { margin: 0; font-family: 'Montserrat', sans-serif; font-size: 14px; letter-spacing: 0.6px; text-transform: uppercase; color: var(--text-light); }

      /* Pledge ledger */
      .ev-ledger { width: 100%; border-collapse: collapse; font-size: 13px; }
      .ev-ledger th { text-align: left; font-family: 'Montserrat', sans-serif; font-size: 10px; letter-spacing: 0.8px; text-transform: uppercase; color: var(--text-muted); padding: 6px 8px; border-bottom: 1px solid rgba(255,255,255,0.08); white-space: nowrap; }
      .ev-ledger th.num { text-align: right; }
      .ev-ledger td { padding: 4px 6px; border-bottom: 1px solid rgba(255,255,255,0.04); }
      .ev-ledger input, .ev-ledger select {
        width: 100%; box-sizing: border-box; background: transparent; border: 1px solid transparent;
        color: var(--text-white); font-family: 'Roboto Slab', serif; font-size: 13px; padding: 6px 7px; border-radius: 5px;
      }
      .ev-ledger input:hover, .ev-ledger select:hover { border-color: var(--border-medium); }
      .ev-ledger input:focus, .ev-ledger select:focus { outline: none; border-color: var(--text-accent); background: rgba(15, 34, 51, 0.6); box-shadow: 0 0 0 2px rgba(112, 214, 236, 0.15); }
      .ev-ledger input.num { text-align: right; font-variant-numeric: tabular-nums; }
      .ev-ledger select option { background: #0e2237; }
      .ev-ledger tfoot td { padding: 8px; font-family: 'Montserrat', sans-serif; font-weight: 700; color: var(--text-white); border-top: 1px solid rgba(255,255,255,0.12); font-variant-numeric: tabular-nums; text-align: right; }
      .ev-ledger tfoot td.lbl { text-align: right; color: var(--text-muted); text-transform: uppercase; font-size: 11px; letter-spacing: 0.8px; }
      .ev-row-del { background: transparent; border: 0; color: var(--text-muted); cursor: pointer; font-size: 16px; padding: 2px 6px; border-radius: 4px; }
      .ev-row-del:hover { color: #ff8a8a; background: rgba(255, 107, 107, 0.1); }
      .ev-ledger-wrap { overflow-x: auto; }

      /* Checklists */
      .ev-checks { display: grid; grid-template-columns: 1fr 1fr; gap: 20px; }
      @media (max-width: 760px) { .ev-checks { grid-template-columns: 1fr; } }
      .ev-check-list { list-style: none; margin: 0; padding: 0; }
      .ev-check-item { display: flex; align-items: center; gap: 10px; padding: 8px 4px; border-bottom: 1px solid rgba(255,255,255,0.04); }
      .ev-check-item label { display: flex; align-items: center; gap: 10px; flex: 1; cursor: pointer; font-size: 13px; color: var(--text-light); }
      .ev-check-item input[type="checkbox"] { width: 17px; height: 17px; accent-color: var(--text-accent); cursor: pointer; flex: 0 0 auto; }
      .ev-check-item.is-done label { color: var(--text-muted); text-decoration: line-through; }
      .ev-check-date { font-size: 11px; color: var(--text-muted); font-variant-numeric: tabular-nums; white-space: nowrap; }
      .ev-check-progress { font-size: 11px; color: var(--text-muted); font-weight: 600; }

      /* Create/edit modal */
      .ev-modal-bg { position: fixed; inset: 0; background: rgba(15, 34, 51, 0.62); display: flex; align-items: flex-start; justify-content: center; padding: 40px 20px; z-index: 80; overflow-y: auto; }
      .ev-modal-bg[hidden] { display: none; }
      .ev-modal { background: #0e2237; border: 1px solid rgba(255,255,255,0.08); width: 100%; max-width: 720px; border-radius: 12px; box-shadow: 0 24px 64px rgba(0,0,0,0.5); overflow: hidden; }
      .ev-modal-head { display: flex; align-items: center; justify-content: space-between; padding: 16px 22px; background: rgba(15, 34, 51, 0.8); border-bottom: 1px solid rgba(255,255,255,0.06); }
      .ev-modal-head h3 { margin: 0; font-family: 'Montserrat', sans-serif; font-size: 16px; color: var(--text-white); }
      .ev-modal-close { background: transparent; border: 0; color: var(--text-light); font-size: 22px; cursor: pointer; padding: 0 4px; }
      .ev-modal-body { padding: 20px 22px 4px; }
      .ev-form-row { display: grid; grid-template-columns: repeat(2, 1fr); gap: 14px 16px; margin-bottom: 14px; }
      .ev-form-row label { display: flex; flex-direction: column; gap: 5px; font-family: 'Montserrat', sans-serif; font-size: 10px; text-transform: uppercase; letter-spacing: 1.2px; font-weight: 700; color: var(--text-muted); }
      .ev-form-wide { grid-column: 1 / -1; }
      .ev-form-row input, .ev-form-row select, .ev-form-row textarea {
        font-family: 'Roboto Slab', Georgia, serif; font-size: 14px; color: var(--text-white);
        padding: 10px 12px; border: 1px solid var(--border-medium); border-radius: 6px; background: rgba(15, 34, 51, 0.6);
        text-transform: none; letter-spacing: 0; font-weight: 400;
      }
      .ev-form-row input:focus, .ev-form-row select:focus, .ev-form-row textarea:focus { outline: none; border-color: var(--text-accent); box-shadow: 0 0 0 3px rgba(112, 214, 236, 0.18); }
      .ev-form-row textarea { resize: vertical; min-height: 70px; }
      .ev-modal-foot { display: flex; align-items: center; gap: 8px; padding: 14px 22px; border-top: 1px solid rgba(255,255,255,0.06); background: rgba(15, 34, 51, 0.45); }
      @media (max-width: 640px) { .ev-form-row { grid-template-columns: 1fr; } }
    </style>
  </head>

  <body class="admin-shell">
    <div
      id="shell-root"
      data-active-nav="events"
      data-page-eyebrow="Fundraising"
      data-page-title="Fundraising Events"
      data-page-sub="House parties, Zoom calls, and receptions &mdash; track goals, pledges, RSVPs, and the build &amp; follow-up checklist for each event."
    ></div>

    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <script src="/admin/admin-shell.js"></script>

    <script>
      (function () {
        'use strict';

        var STATUS_OPTIONS = ['planning','active','completed','cancelled'];
        var STATUS_LABEL = { planning:'Planning', active:'Active', completed:'Completed', cancelled:'Cancelled' };
        var RSVP_OPTIONS = ['', 'yes', 'no', 'maybe'];
        var RSVP_LABEL = { '':'—', yes:'Yes', no:'No', maybe:'Maybe' };

        var state = {
          client: null,
          me: null,
          canWrite: false,
          rows: [],           // summary rows
          filtered: [],
          view: 'list',       // list | detail
          activeId: null,
          detail: { event: null, attendees: [], checklist: [] },
          saveTimers: {}      // debounce map for inline ledger saves
        };

        document.addEventListener('admin-shell-ready', function (ev) {
          var detail = ev.detail || {};
          state.client = detail.client;
          state.me = detail.user || null;
          state.canWrite = detail.can('events', 'write');

          renderPageActions();
          document.getElementById('shellBody').innerHTML = listHtml();

          loadEvents()
            .then(function () { renderStats(); applyFilters(); })
            .catch(function (err) {
              console.error('events load failed', err);
              document.getElementById('evBody').innerHTML =
                '<tr><td colspan="8" class="admin-empty-row admin-error">' +
                'Could not load events. Your role may not include this module.' +
                '</td></tr>';
            });

          bindListEvents();

          // Deep-link to a single event: /admin/events?id=<uuid>
          var qid = new URLSearchParams(location.search).get('id');
          if (qid) openDetail(qid);
        });

        // =================================================================
        // Page actions (top-right buttons) — swap by view
        // =================================================================
        function renderPageActions() {
          var actions = document.getElementById('shellPageActions');
          if (!actions) return;
          if (state.view === 'detail') {
            actions.innerHTML = '<button type="button" class="shell-btn shell-btn-outline" id="backToList">&larr; All Events</button>';
            document.getElementById('backToList').addEventListener('click', showList);
          } else {
            actions.innerHTML =
              '<button type="button" class="shell-btn shell-btn-outline" id="exportCsv">Export CSV</button>' +
              (state.canWrite ? '<button type="button" class="shell-btn shell-btn-primary" id="newEventBtn">New Event</button>' : '');
            var ex = document.getElementById('exportCsv');
            if (ex) ex.addEventListener('click', exportCsv);
            var nb = document.getElementById('newEventBtn');
            if (nb) nb.addEventListener('click', function () { openModal(null); });
          }
        }

        // =================================================================
        // LIST VIEW
        // =================================================================
        function listHtml() {
          return [
            '<div class="admin-stat-grid">',
              '<div class="admin-stat"><div class="admin-stat-num" id="statEvents">0</div><div class="admin-stat-label">Events</div></div>',
              '<div class="admin-stat"><div class="admin-stat-num" id="statUpcoming">0</div><div class="admin-stat-label">Upcoming</div></div>',
              '<div class="admin-stat"><div class="admin-stat-num" id="statGoal">$0</div><div class="admin-stat-label">Total Goal</div></div>',
              '<div class="admin-stat"><div class="admin-stat-num" id="statIn">$0</div><div class="admin-stat-label">Total Raised (In)</div></div>',
              '<div class="admin-stat"><div class="admin-stat-num" id="statPledged">$0</div><div class="admin-stat-label">Total Pledged</div></div>',
            '</div>',

            '<div class="admin-toolbar">',
              '<input type="search" class="admin-input" id="filterSearch" placeholder="Search event, host, source code..." autocomplete="off" />',
              '<select class="admin-input" id="filterStatus">',
                '<option value="">All statuses</option>',
                STATUS_OPTIONS.map(function (s) { return '<option value="' + s + '">' + STATUS_LABEL[s] + '</option>'; }).join(''),
              '</select>',
              '<span class="admin-toolbar-spacer"></span>',
              '<span class="admin-result-count" id="resultCount"></span>',
            '</div>',

            '<div class="admin-table-wrap">',
              '<table class="admin-table ev-table" id="evTable">',
                '<thead><tr>',
                  '<th>Event</th>',
                  '<th>Date</th>',
                  '<th class="ev-num-h">Goal</th>',
                  '<th class="ev-num-h">Raised</th>',
                  '<th class="ev-num-h">Pledged</th>',
                  '<th class="ev-num-h">RSVPs</th>',
                  '<th>Progress</th>',
                  '<th>Status</th>',
                '</tr></thead>',
                '<tbody id="evBody"><tr><td colspan="8" class="admin-empty-row">Loading events…</td></tr></tbody>',
              '</table>',
            '</div>',

            modalHtml()
          ].join('');
        }

        function renderStats() {
          var today = todayISO();
          var c = { events: state.rows.length, upcoming: 0, goal: 0, income: 0, pledged: 0 };
          state.rows.forEach(function (r) {
            if (r.event_date && r.event_date >= today && r.status !== 'cancelled' && r.status !== 'completed') c.upcoming++;
            c.goal    += num(r.goal);
            c.income  += num(r.total_in);
            c.pledged += num(r.total_pledged);
          });
          $('statEvents').textContent   = c.events.toLocaleString();
          $('statUpcoming').textContent = c.upcoming.toLocaleString();
          $('statGoal').textContent     = money(c.goal);
          $('statIn').textContent       = money(c.income);
          $('statPledged').textContent  = money(c.pledged);
        }

        function applyFilters() {
          var q = $('filterSearch').value.trim().toLowerCase();
          var st = $('filterStatus').value;
          state.filtered = state.rows.filter(function (r) {
            if (st && r.status !== st) return false;
            if (q) {
              var hay = ((r.name||'') + ' ' + (r.host_name||'') + ' ' + (r.source_code||'') + ' ' + (r.location||'')).toLowerCase();
              if (hay.indexOf(q) === -1) return false;
            }
            return true;
          });
          renderRows();
        }

        function renderRows() {
          var body = $('evBody');
          $('resultCount').textContent = state.filtered.length === state.rows.length
            ? state.rows.length + ' total'
            : state.filtered.length + ' of ' + state.rows.length;

          if (state.filtered.length === 0) {
            var msg = state.rows.length === 0
              ? 'No events yet. Click “New Event” to build one from the template.'
              : 'No events match the current filters.';
            body.innerHTML = '<tr><td colspan="8" class="admin-empty-row">' + msg + '</td></tr>';
            return;
          }

          body.innerHTML = state.filtered.map(function (r) {
            var goal = num(r.goal), income = num(r.total_in);
            var pct = goal > 0 ? Math.min(100, Math.round(income / goal * 100)) : 0;
            var sub = [r.host_name ? escapeHtml(r.host_name) : '', r.location ? escapeHtml(r.location) : '']
              .filter(Boolean).join(' · ');
            return '<tr data-id="' + escapeAttr(r.id) + '">' +
              '<td><div class="ev-name-cell">' + escapeHtml(r.name || 'Untitled event') + '</div>' +
                (sub ? '<div class="ev-name-sub">' + sub + '</div>' : '') + '</td>' +
              '<td>' + (r.event_date ? escapeHtml(fmtDate(r.event_date)) : '<span class="admin-muted">—</span>') +
                (r.event_time ? '<div class="ev-name-sub">' + escapeHtml(r.event_time) + '</div>' : '') + '</td>' +
              '<td class="ev-num">' + money(goal) + '</td>' +
              '<td class="ev-num">' + money(income) + '</td>' +
              '<td class="ev-num">' + money(num(r.total_pledged)) + '</td>' +
              '<td class="ev-num">' + num(r.rsvp_count) + '</td>' +
              '<td class="ev-progress"><div class="ev-progress-bar"><div class="ev-progress-fill" style="width:' + pct + '%"></div></div>' +
                '<div class="ev-progress-txt">' + pct + '% of goal</div></td>' +
              '<td><span class="admin-pill admin-status-' + escapeAttr(r.status) + '">' + escapeHtml(STATUS_LABEL[r.status] || r.status) + '</span></td>' +
            '</tr>';
          }).join('');
        }

        function bindListEvents() {
          var debT;
          $('filterSearch').addEventListener('input', function () { clearTimeout(debT); debT = setTimeout(applyFilters, 150); });
          $('filterStatus').addEventListener('change', applyFilters);

          $('evBody').addEventListener('click', function (ev) {
            var tr = ev.target.closest('tr[data-id]');
            if (tr) openDetail(tr.dataset.id);
          });

          // Modal wiring
          $('evForm').addEventListener('submit', handleFormSubmit);
          $('evFormCancel').addEventListener('click', closeModal);
          $('evModalClose').addEventListener('click', closeModal);
          $('evModal').addEventListener('click', function (ev) { if (ev.target.id === 'evModal') closeModal(); });
        }

        function showList() {
          state.view = 'list';
          state.activeId = null;
          history.replaceState(null, '', '/admin/events');
          document.getElementById('shellBody').innerHTML = listHtml();
          bindListEvents();
          renderPageActions();
          renderStats();
          applyFilters();
        }

        // =================================================================
        // DATA
        // =================================================================
        function loadEvents() {
          return state.client
            .from('fundraising_events_summary')
            .select('*')
            .order('event_date', { ascending: false, nullsFirst: false })
            .then(function (resp) {
              if (resp.error) throw resp.error;
              state.rows = resp.data || [];
              return state.rows;
            });
        }

        function loadDetail(id) {
          return Promise.all([
            state.client.from('fundraising_events_summary').select('*').eq('id', id).single(),
            state.client.from('fundraising_event_attendees').select('*').eq('event_id', id).order('sort_order', { ascending: true }).order('created_at', { ascending: true }),
            state.client.from('fundraising_event_checklist').select('*').eq('event_id', id).order('phase', { ascending: true }).order('sort_order', { ascending: true })
          ]).then(function (r) {
            if (r[0].error) throw r[0].error;
            return {
              event: r[0].data,
              attendees: (r[1] && r[1].data) || [],
              checklist: (r[2] && r[2].data) || []
            };
          });
        }

        // =================================================================
        // DETAIL VIEW
        // =================================================================
        function openDetail(id) {
          state.activeId = id;
          state.view = 'detail';
          history.replaceState(null, '', '/admin/events?id=' + encodeURIComponent(id));
          document.getElementById('shellBody').innerHTML = '<div class="admin-loading">Loading event…</div>';
          renderPageActions();
          loadDetail(id).then(function (d) {
            state.detail = d;
            renderDetail();
          }).catch(function (err) {
            console.error('detail load failed', err);
            document.getElementById('shellBody').innerHTML =
              '<div class="ev-section admin-error">Could not load this event.</div>';
          });
        }

        function renderDetail() {
          var e = state.detail.event;
          if (!e) return;
          var goal = num(e.goal), income = num(e.total_in), pledged = num(e.total_pledged),
              out = num(e.total_out), variance = num(e.variance_to_goal);

          var links = [];
          if (e.zoom_link)    links.push('<a href="' + escapeAttr(e.zoom_link) + '" target="_blank" rel="noopener">Zoom</a>');
          if (e.donate_page)  links.push('<a href="' + escapeAttr(e.donate_page) + '" target="_blank" rel="noopener">Donate Page</a>');
          if (e.actblue_page) links.push('<a href="' + escapeAttr(e.actblue_page) + '" target="_blank" rel="noopener">ActBlue</a>');
          if (e.pdf_invite_url) links.push('<a href="' + escapeAttr(e.pdf_invite_url) + '" target="_blank" rel="noopener">PDF Invite</a>');

          var meta = [];
          if (e.event_date) meta.push(escapeHtml(fmtDate(e.event_date)) + (e.event_time ? ' · ' + escapeHtml(e.event_time) : ''));
          if (e.host_name)  meta.push('Host: ' + escapeHtml(e.host_name));
          if (e.location)   meta.push(escapeHtml(e.location));
          if (e.source_code) meta.push('Source: ' + escapeHtml(e.source_code));

          var editBtns = state.canWrite
            ? '<button type="button" class="shell-btn shell-btn-outline" id="editEventBtn">Edit Details</button>' +
              '<button type="button" class="shell-btn shell-btn-ghost" id="deleteEventBtn" style="color:#ff8a8a">Delete</button>'
            : '';

          var html =
            '<div class="ev-detail-head">' +
              '<div>' +
                '<h2>' + escapeHtml(e.name || 'Untitled event') + ' ' +
                  '<span class="admin-pill admin-status-' + escapeAttr(e.status) + '" style="vertical-align:middle;margin-left:6px;font-size:11px">' + escapeHtml(STATUS_LABEL[e.status] || e.status) + '</span></h2>' +
                (meta.length ? '<div class="ev-detail-meta">' + meta.join('<span>·</span>') + '</div>' : '') +
                (links.length ? '<div class="ev-detail-meta" style="margin-top:8px">' + links.join(' ') + '</div>' : '') +
                (e.giving_levels ? '<div class="ev-detail-meta" style="margin-top:8px"><span class="admin-muted">Giving levels:</span> ' + escapeHtml(e.giving_levels) + '</div>' : '') +
              '</div>' +
              '<div class="ev-detail-actions">' + editBtns + '</div>' +
            '</div>' +

            '<div class="ev-kpi-grid">' +
              kpi(money(goal), 'Goal') +
              kpi(money(pledged), 'Total Pledged') +
              kpi(money(income), 'Total In') +
              kpi(money(out), 'Total Out') +
              kpi(money(variance), 'Variance to Goal', variance >= 0 ? 'is-pos' : 'is-neg') +
              kpi(num(e.rsvp_count) + ' / ' + num(e.attendee_count), 'RSVPs / Guests') +
            '</div>' +

            ledgerSectionHtml() +
            checklistSectionHtml();

          document.getElementById('shellBody').innerHTML = html;
          bindDetailEvents();
        }

        function kpi(numTxt, label, cls) {
          return '<div class="ev-kpi"><div class="ev-kpi-num ' + (cls||'') + '">' + numTxt + '</div><div class="ev-kpi-label">' + label + '</div></div>';
        }

        // ---- Pledge ledger ----
        function ledgerSectionHtml() {
          var rows = state.detail.attendees;
          var t = { pledged: 0, income: 0, out: 0, rsvp: 0 };
          var bodyRows = rows.map(function (a) {
            t.pledged += num(a.pledged); t.income += num(a.amount_in); t.out += num(a.amount_out);
            if (String(a.rsvp||'').toLowerCase() === 'yes') t.rsvp++;
            return ledgerRowHtml(a);
          }).join('');

          var ro = !state.canWrite;
          var addBtn = state.canWrite ? '<button type="button" class="shell-btn shell-btn-outline" id="addAttendee">+ Add Guest</button>' : '';

          return '<div class="ev-section">' +
            '<div class="ev-section-head"><h3>Pledge &amp; RSVP Ledger</h3>' + addBtn + '</div>' +
            '<div class="ev-ledger-wrap"><table class="ev-ledger" id="ledgerTable">' +
              '<thead><tr>' +
                '<th>First</th><th>Last</th><th>Email</th>' +
                '<th class="num">Pledged</th><th class="num">In</th><th class="num">Out</th>' +
                '<th>RSVP</th><th>Notes</th><th></th>' +
              '</tr></thead>' +
              '<tbody id="ledgerBody">' + (bodyRows ||
                '<tr><td colspan="9" class="admin-empty-row">No guests yet.' + (ro ? '' : ' Use “Add Guest” to start the ledger.') + '</td></tr>') + '</tbody>' +
              '<tfoot><tr>' +
                '<td class="lbl" colspan="3">Totals</td>' +
                '<td>' + money(t.pledged) + '</td>' +
                '<td>' + money(t.income) + '</td>' +
                '<td>' + money(t.out) + '</td>' +
                '<td style="text-align:left">' + t.rsvp + ' yes</td>' +
                '<td colspan="2"></td>' +
              '</tr></tfoot>' +
            '</table></div>' +
          '</div>';
        }

        function ledgerRowHtml(a) {
          var ro = state.canWrite ? '' : ' disabled';
          function inp(field, val, extra) {
            return '<input data-field="' + field + '" data-id="' + escapeAttr(a.id) + '" value="' + escapeAttr(val == null ? '' : val) + '"' + (extra||'') + ro + ' />';
          }
          function money_inp(field, val) {
            return '<input class="num" type="number" step="0.01" min="0" data-field="' + field + '" data-id="' + escapeAttr(a.id) + '" value="' + escapeAttr(val == null || Number(val) === 0 ? '' : val) + '" placeholder="0"' + ro + ' />';
          }
          var rsvpSel = '<select data-field="rsvp" data-id="' + escapeAttr(a.id) + '"' + ro + '>' +
            RSVP_OPTIONS.map(function (o) {
              return '<option value="' + o + '"' + (String(a.rsvp||'').toLowerCase() === o ? ' selected' : '') + '>' + RSVP_LABEL[o] + '</option>';
            }).join('') + '</select>';
          var del = state.canWrite ? '<button type="button" class="ev-row-del" data-del="' + escapeAttr(a.id) + '" title="Remove guest">&times;</button>' : '';
          return '<tr data-row="' + escapeAttr(a.id) + '">' +
            '<td>' + inp('first_name', a.first_name) + '</td>' +
            '<td>' + inp('last_name', a.last_name) + '</td>' +
            '<td>' + inp('email', a.email, ' type="email"') + '</td>' +
            '<td>' + money_inp('pledged', a.pledged) + '</td>' +
            '<td>' + money_inp('amount_in', a.amount_in) + '</td>' +
            '<td>' + money_inp('amount_out', a.amount_out) + '</td>' +
            '<td>' + rsvpSel + '</td>' +
            '<td>' + inp('notes', a.notes) + '</td>' +
            '<td>' + del + '</td>' +
          '</tr>';
        }

        // ---- Checklists ----
        function checklistSectionHtml() {
          var build = state.detail.checklist.filter(function (c) { return c.phase === 'build'; });
          var follow = state.detail.checklist.filter(function (c) { return c.phase === 'followup'; });
          return '<div class="ev-section">' +
            '<div class="ev-section-head"><h3>Checklists</h3></div>' +
            '<div class="ev-checks">' +
              checklistColumn('Event Build', build) +
              checklistColumn('Follow-Up', follow) +
            '</div></div>';
        }

        function checklistColumn(title, items) {
          var done = items.filter(function (c) { return c.is_done; }).length;
          var ro = state.canWrite ? '' : ' disabled';
          var lis = items.map(function (c) {
            return '<li class="ev-check-item' + (c.is_done ? ' is-done' : '') + '" data-check="' + escapeAttr(c.id) + '">' +
              '<label><input type="checkbox" data-check-toggle="' + escapeAttr(c.id) + '"' + (c.is_done ? ' checked' : '') + ro + ' />' +
              '<span>' + escapeHtml(c.label) + '</span></label>' +
              '<span class="ev-check-date">' + (c.completed_on ? escapeHtml(fmtDate(c.completed_on)) : '') + '</span>' +
            '</li>';
          }).join('');
          return '<div><div class="ev-section-head" style="margin-bottom:8px">' +
            '<h3 style="font-size:12px">' + escapeHtml(title) + '</h3>' +
            '<span class="ev-check-progress">' + done + '/' + items.length + '</span></div>' +
            '<ul class="ev-check-list">' + (lis || '<li class="admin-muted" style="padding:8px 4px">No items.</li>') + '</ul></div>';
        }

        function bindDetailEvents() {
          var edit = $('editEventBtn');
          if (edit) edit.addEventListener('click', function () { openModal(state.detail.event); });
          var del = $('deleteEventBtn');
          if (del) del.addEventListener('click', deleteEvent);

          var add = $('addAttendee');
          if (add) add.addEventListener('click', addAttendee);

          var body = $('ledgerBody');
          if (body) {
            body.addEventListener('change', onLedgerChange);
            body.addEventListener('input', onLedgerChange);
            body.addEventListener('click', function (ev) {
              var d = ev.target.closest('[data-del]');
              if (d) deleteAttendee(d.getAttribute('data-del'));
            });
          }

          // Checklist toggles
          document.querySelectorAll('[data-check-toggle]').forEach(function (cb) {
            cb.addEventListener('change', function () { toggleCheck(cb.getAttribute('data-check-toggle'), cb.checked); });
          });
        }

        // =================================================================
        // LEDGER MUTATIONS (inline, debounced)
        // =================================================================
        function onLedgerChange(ev) {
          var el = ev.target;
          var field = el.getAttribute('data-field');
          var id = el.getAttribute('data-id');
          if (!field || !id || !state.canWrite) return;

          var moneyFields = { pledged: 1, amount_in: 1, amount_out: 1 };
          var value = moneyFields[field] ? (el.value === '' ? 0 : Number(el.value)) : (el.value === '' ? null : el.value);

          // Update local cache immediately (for footer totals + summary refresh)
          var row = state.detail.attendees.find(function (a) { return a.id === id; });
          if (row) row[field] = value;
          if (moneyFields[field] || field === 'rsvp') refreshLedgerFooter();

          var key = id + ':' + field;
          clearTimeout(state.saveTimers[key]);
          state.saveTimers[key] = setTimeout(function () {
            var patch = {}; patch[field] = value;
            state.client.from('fundraising_event_attendees').update(patch).eq('id', id)
              .then(function (r) { if (r.error) throw r.error; })
              .catch(function (e) { console.error('attendee save failed', e); window.AdminShell.toast('Could not save that change.', 'error'); });
          }, 500);
        }

        function refreshLedgerFooter() {
          var t = { pledged: 0, income: 0, out: 0, rsvp: 0 };
          state.detail.attendees.forEach(function (a) {
            t.pledged += num(a.pledged); t.income += num(a.amount_in); t.out += num(a.amount_out);
            if (String(a.rsvp||'').toLowerCase() === 'yes') t.rsvp++;
          });
          var tf = document.querySelector('#ledgerTable tfoot tr');
          if (!tf) return;
          var tds = tf.querySelectorAll('td');
          tds[1].textContent = money(t.pledged);
          tds[2].textContent = money(t.income);
          tds[3].textContent = money(t.out);
          tds[4].textContent = t.rsvp + ' yes';
        }

        function addAttendee() {
          var maxOrder = state.detail.attendees.reduce(function (m, a) { return Math.max(m, a.sort_order || 0); }, 0);
          var payload = { event_id: state.activeId, sort_order: maxOrder + 1, pledged: 0, amount_in: 0, amount_out: 0 };
          state.client.from('fundraising_event_attendees').insert(payload).select('*').single()
            .then(function (r) {
              if (r.error) throw r.error;
              state.detail.attendees.push(r.data);
              // Re-render just the ledger body
              var body = $('ledgerBody');
              if (body) {
                if (state.detail.attendees.length === 1) body.innerHTML = '';
                body.insertAdjacentHTML('beforeend', ledgerRowHtml(r.data));
                var first = body.querySelector('tr[data-row="' + r.data.id + '"] input');
                if (first) first.focus();
              }
              refreshLedgerFooter();
            })
            .catch(function (e) { console.error('add attendee failed', e); window.AdminShell.toast('Could not add guest.', 'error'); });
        }

        function deleteAttendee(id) {
          state.client.from('fundraising_event_attendees').delete().eq('id', id)
            .then(function (r) {
              if (r.error) throw r.error;
              state.detail.attendees = state.detail.attendees.filter(function (a) { return a.id !== id; });
              var tr = document.querySelector('tr[data-row="' + id + '"]');
              if (tr) tr.remove();
              if (state.detail.attendees.length === 0) {
                $('ledgerBody').innerHTML = '<tr><td colspan="9" class="admin-empty-row">No guests yet. Use “Add Guest” to start the ledger.</td></tr>';
              }
              refreshLedgerFooter();
            })
            .catch(function (e) { console.error('delete attendee failed', e); window.AdminShell.toast('Could not remove guest.', 'error'); });
        }

        function toggleCheck(id, done) {
          state.client.from('fundraising_event_checklist').update({ is_done: done }).eq('id', id).select('*').single()
            .then(function (r) {
              if (r.error) throw r.error;
              var item = state.detail.checklist.find(function (c) { return c.id === id; });
              if (item) { item.is_done = r.data.is_done; item.completed_on = r.data.completed_on; }
              // Update the row's styling + date + column count without full re-render
              var li = document.querySelector('[data-check="' + id + '"]');
              if (li) {
                li.classList.toggle('is-done', r.data.is_done);
                var dateEl = li.querySelector('.ev-check-date');
                if (dateEl) dateEl.textContent = r.data.completed_on ? fmtDate(r.data.completed_on) : '';
                var col = li.closest('div');
                var prog = col ? col.querySelector('.ev-check-progress') : null;
                if (prog) {
                  var items = state.detail.checklist.filter(function (c) { return c.phase === item.phase; });
                  var d = items.filter(function (c) { return c.is_done; }).length;
                  prog.textContent = d + '/' + items.length;
                }
              }
            })
            .catch(function (e) { console.error('checklist toggle failed', e); window.AdminShell.toast('Could not update checklist.', 'error'); });
        }

        function deleteEvent() {
          var e = state.detail.event;
          if (!e || !window.confirm('Delete “' + (e.name || 'this event') + '” and its ledger and checklists? This cannot be undone.')) return;
          state.client.from('fundraising_events').delete().eq('id', e.id)
            .then(function (r) {
              if (r.error) throw r.error;
              window.AdminShell.toast('Event deleted.', 'success');
              return loadEvents();
            })
            .then(function () { showList(); })
            .catch(function (err) { console.error('delete event failed', err); window.AdminShell.toast('Could not delete event. ' + (err.message||''), 'error'); });
        }

        // =================================================================
        // CREATE / EDIT MODAL
        // =================================================================
        function modalHtml() {
          return [
            '<div class="ev-modal-bg" id="evModal" hidden>',
              '<div class="ev-modal" role="dialog" aria-modal="true" aria-labelledby="evModalTitle">',
                '<div class="ev-modal-head"><h3 id="evModalTitle">New Event</h3>',
                  '<button type="button" class="ev-modal-close" id="evModalClose" aria-label="Close">&times;</button></div>',
                '<form id="evForm" autocomplete="off">',
                  '<div class="ev-modal-body">',
                    '<div class="ev-form-row">',
                      '<label class="ev-form-wide">Event Name<input type="text" name="name" required maxlength="200" /></label>',
                      '<label>Event Date<input type="date" name="event_date" /></label>',
                      '<label>Event Time<input type="text" name="event_time" maxlength="60" placeholder="6:00 PM ET" /></label>',
                      '<label>Status<select name="status">' +
                        STATUS_OPTIONS.map(function (s) { return '<option value="' + s + '"' + (s==='planning'?' selected':'') + '>' + STATUS_LABEL[s] + '</option>'; }).join('') +
                      '</select></label>',
                      '<label>Goal ($)<input type="number" name="goal" step="0.01" min="0" placeholder="0" /></label>',
                      '<label>Host / Committee<input type="text" name="host_name" maxlength="160" /></label>',
                      '<label>Location<input type="text" name="location" maxlength="160" placeholder="Virtual / venue" /></label>',
                      '<label class="ev-form-wide">Giving Levels<input type="text" name="giving_levels" maxlength="300" placeholder="e.g. $1,000 · $500 · $250 · $100" /></label>',
                      '<label>Zoom Link<input type="url" name="zoom_link" placeholder="https://" /></label>',
                      '<label>Source Code<input type="text" name="source_code" maxlength="80" /></label>',
                      '<label>Donate Page<input type="url" name="donate_page" placeholder="https://" /></label>',
                      '<label>ActBlue Page<input type="url" name="actblue_page" placeholder="https://" /></label>',
                      '<label class="ev-form-wide">PDF Invite URL<input type="url" name="pdf_invite_url" placeholder="https://" /></label>',
                      '<label class="ev-form-wide">Notes<textarea name="notes" rows="3"></textarea></label>',
                    '</div>',
                  '</div>',
                  '<div class="ev-modal-foot">',
                    '<span style="flex:1"></span>',
                    '<button type="button" class="shell-btn shell-btn-outline" id="evFormCancel">Cancel</button>',
                    '<button type="submit" class="shell-btn shell-btn-primary" id="evFormSave">Save Event</button>',
                  '</div>',
                '</form>',
              '</div>',
            '</div>'
          ].join('');
        }

        // The modal lives inside listHtml(). When we're in detail view we
        // inject it on demand so Edit works from the detail screen too.
        function ensureModal() {
          if (document.getElementById('evModal')) return;
          document.getElementById('shellBody').insertAdjacentHTML('beforeend', modalHtml());
          $('evForm').addEventListener('submit', handleFormSubmit);
          $('evFormCancel').addEventListener('click', closeModal);
          $('evModalClose').addEventListener('click', closeModal);
          $('evModal').addEventListener('click', function (ev) { if (ev.target.id === 'evModal') closeModal(); });
        }

        function openModal(existing) {
          ensureModal();
          var form = $('evForm');
          $('evModalTitle').textContent = existing ? 'Edit Event' : 'New Event';
          form.reset();
          form.dataset.eventId = existing ? existing.id : '';
          if (existing) {
            ['name','event_time','host_name','location','giving_levels','zoom_link','source_code','donate_page','actblue_page','pdf_invite_url','notes','status'].forEach(function (f) {
              if (form.elements[f]) form.elements[f].value = existing[f] || '';
            });
            form.elements.event_date.value = existing.event_date || '';
            form.elements.goal.value = existing.goal != null && Number(existing.goal) !== 0 ? existing.goal : '';
          }
          $('evModal').hidden = false;
          setTimeout(function () { try { form.elements.name.focus(); } catch (e) {} }, 50);
        }

        function closeModal() { var m = $('evModal'); if (m) m.hidden = true; }

        function handleFormSubmit(ev) {
          ev.preventDefault();
          var form = ev.target;
          var btn = $('evFormSave');
          var id = form.dataset.eventId || null;
          var payload = {
            name:          form.elements.name.value.trim(),
            event_date:    form.elements.event_date.value || null,
            event_time:    form.elements.event_time.value.trim() || null,
            status:        form.elements.status.value,
            goal:          form.elements.goal.value === '' ? 0 : Number(form.elements.goal.value),
            host_name:     form.elements.host_name.value.trim() || null,
            location:      form.elements.location.value.trim() || null,
            giving_levels: form.elements.giving_levels.value.trim() || null,
            zoom_link:     form.elements.zoom_link.value.trim() || null,
            source_code:   form.elements.source_code.value.trim() || null,
            donate_page:   form.elements.donate_page.value.trim() || null,
            actblue_page:  form.elements.actblue_page.value.trim() || null,
            pdf_invite_url: form.elements.pdf_invite_url.value.trim() || null,
            notes:         form.elements.notes.value.trim() || null
          };
          if (!payload.name) return;
          btn.disabled = true; btn.textContent = 'Saving…';

          var op;
          if (id) {
            op = state.client.from('fundraising_events').update(payload).eq('id', id).select('id').single();
          } else {
            if (state.me && state.me.id) payload.created_by = state.me.id;
            op = state.client.from('fundraising_events').insert(payload).select('id').single();
          }

          op.then(function (r) {
            if (r.error) throw r.error;
            var savedId = r.data.id;
            return loadEvents().then(function () { return savedId; });
          }).then(function (savedId) {
            window.AdminShell.toast(id ? 'Event updated.' : 'Event created.', 'success');
            closeModal();
            if (state.view === 'detail' || id) {
              openDetail(savedId);
            } else {
              renderStats(); applyFilters();
            }
          }).catch(function (err) {
            console.error('save event failed', err);
            window.AdminShell.toast('Could not save event. ' + (err.message||''), 'error');
          }).finally(function () { btn.disabled = false; btn.textContent = 'Save Event'; });
        }

        // =================================================================
        // CSV EXPORT (list)
        // =================================================================
        function exportCsv() {
          if (state.filtered.length === 0) { window.AdminShell.toast('Nothing to export.', 'error'); return; }
          var cols = ['name','event_date','event_time','status','host_name','location','goal','total_pledged','total_in','total_out','variance_to_goal','rsvp_count','attendee_count','source_code'];
          var lines = [cols.join(',')];
          state.filtered.forEach(function (r) {
            lines.push(cols.map(function (c) {
              var v = r[c]; if (v == null) v = '';
              v = String(v).replace(/"/g, '""');
              return /[,"\n]/.test(v) ? '"' + v + '"' : v;
            }).join(','));
          });
          var blob = new Blob([lines.join('\n')], { type: 'text/csv' });
          var url = URL.createObjectURL(blob);
          var a = document.createElement('a');
          a.href = url; a.download = 'ohio-pride-events-' + new Date().toISOString().slice(0,10) + '.csv';
          document.body.appendChild(a); a.click(); a.remove();
          URL.revokeObjectURL(url);
          window.AdminShell.toast('Exported ' + state.filtered.length + ' events.', 'success');
        }

        // =================================================================
        // HELPERS
        // =================================================================
        function $(id) { return document.getElementById(id); }
        function num(v) { var n = Number(v); return isNaN(n) ? 0 : n; }
        function money(v) {
          return '$' + num(v).toLocaleString('en-US', { minimumFractionDigits: 0, maximumFractionDigits: 0 });
        }
        function todayISO() {
          var d = new Date();
          return d.getFullYear() + '-' + String(d.getMonth()+1).padStart(2,'0') + '-' + String(d.getDate()).padStart(2,'0');
        }
        function fmtDate(iso) {
          if (!iso) return '';
          var d = new Date(iso + (iso.length === 10 ? 'T00:00:00' : ''));
          if (isNaN(d.getTime())) return iso;
          return d.toLocaleDateString('en-US', { month: 'short', day: 'numeric', year: 'numeric' });
        }
        function escapeHtml(s) {
          return String(s == null ? '' : s).replace(/[&<>"']/g, function (c) {
            return { '&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;' }[c];
          });
        }
        function escapeAttr(s) { return escapeHtml(s).replace(/"/g, '&quot;'); }
      })();
    </script>
    <script src="/admin/admin-responsive.js" defer></script>
  </body>
</html>
